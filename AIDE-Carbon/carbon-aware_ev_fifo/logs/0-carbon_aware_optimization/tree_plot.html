de = node\n                use_exec = alloc\n                self.exec_map[job_dag] = current_assigned + alloc\n                available -= alloc\n                carbon_aware_flag = (P > 1.2)\n                break\n\n        if selected_node is None and available > 0:\n            for job_dag in job_dags:\n                if available <= 0:\n                    break\n                candidate_nodes = [n for n in frontier_nodes if n.job_dag == job_dag]\n                if not candidate_nodes:\n                    continue\n                node = candidate_nodes[0]\n                task_demand = node.num_tasks - node.next_task_idx - exec_commit.node_commit.get(node, 0) - moving_executors.count(node)\n                if task_demand <= 0:\n                    continue\n                current_assigned = self.exec_map.get(job_dag, 0)\n                if current_assigned >= self.exec_cap_MAX:\n                    continue\n                alloc = min(available, self.B, task_demand, num_source_exec)\n                if alloc > 0:\n                    selected_node = node\n                    use_exec = alloc\n                    self.exec_map[job_dag] = current_assigned + alloc\n                    carbon_aware_flag = True\n                    break\n\n        if selected_node is None:\n            use_exec = 0\n            carbon_aware_flag = True\n\n        return selected_node, use_exec, carbon_aware_flag\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport math\n\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n        self.last_carbon_update = 0\n        self.update_interval = 30000\n        self.carbon_threshold_low = 280\n        self.carbon_threshold_high = 400\n        self.burst_multiplier = 2.0\n        self.throttle_multiplier = 0.5\n\n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        L = self.carbon_threshold_low\n        U = self.carbon_threshold_high\n        return current_carbon, L, U\n\n    def _update_dynamic_cap(self, current_time):\n        if current_time - self.last_carbon_update < self.update_interval:\n            return\n        self.last_carbon_update = current_time\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        if current_carbon <= L:\n            self.exec_cap = min(self.exec_cap_MAX, int(self.exec_cap_MAX * self.burst_multiplier))\n        elif current_carbon >= U:\n            self.exec_cap = max(self.B, int(self.exec_cap_MAX * self.throttle_multiplier))\n        else:\n            self.exec_cap = self.exec_cap_MAX\n        self.exec_cap = max(self.B, min(self.exec_cap_MAX, self.exec_cap))\n\n    def _compute_job_remaining_tasks(self, job_dag):\n        total_remaining = 0\n        for node in job_dag.nodes:\n            total_remaining += node.num_tasks - node.next_task_idx\n        return total_remaining\n\n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n\n        self._update_dynamic_cap(current_time)\n\n        num_exec = 0\n        for job_dag in list(self.exec_map):\n            num_exec += self.exec_map[job_dag]\n\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        carbon_aware_pause = (source_job is not None and current_carbon >= U)\n\n        if num_exec >= self.exec_cap or carbon_aware_pause:\n            if source_job is not None and source_job in list(self.exec_map):\n                self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n            return None, num_source_exec, True\n\n        if source_job is not None:\n            for node in source_job.frontier_nodes:\n                if node in frontier_nodes:\n                    return node, num_source_exec, False\n            for node in frontier_nodes:\n                if node.job_dag == source_job:\n                    return node, num_source_exec, False\n\n        job_priority_list = []\n        for job_dag in job_dags:\n            if self.exec_map[job_dag] < self.exec_cap:\n                remaining_tasks = self._compute_job_remaining_tasks(job_dag)\n                job_priority_list.append((remaining_tasks, job_dag))\n        job_priority_list.sort(key=lambda x: x[0], reverse=True)\n\n        for _, job_dag in job_priority_list:\n            next_node = None\n            for node in job_dag.frontier_nodes:\n                if node in frontier_nodes:\n                    next_node = node\n                    break\n            if next_node is None:\n                for node in frontier_nodes:\n                    if node.job_dag == job_dag:\n                        next_node = node\n                        break\n            if next_node is not None:\n                use_exec = min(\n                    next_node.num_tasks - next_node.next_task_idx - exec_commit.node_commit[next_node] - moving_executors.count(next_node),\n                    num_source_exec,\n                    self.exec_cap - self.exec_map[job_dag]\n                )\n                if use_exec > 0:\n                    self.exec_map[job_dag] += use_exec\n                    carbon_aware_flag = (current_carbon >= U)\n                    return next_node, use_exec, carbon_aware_flag\n\n        return None, num_source_exec, False\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport heapq\nfrom collections import defaultdict, deque\n\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n\n        self.carbon_forecast = {}\n        self.last_forecast_time = -float('inf')\n        self.forecast_horizon = 300000\n        self.forecast_interval = 50000\n\n        self.job_slack = {}\n        self.job_carbon_budget = {}\n        self.job_remaining_work = {}\n\n        self.carbon_history = []\n        self.history_window = 10\n\n        self.low_window_threshold = 280\n        self.high_window_threshold = 400\n\n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        L = self.low_window_threshold\n        U = self.high_window_threshold\n        return current_carbon, L, U\n\n    def _update_carbon_forecast(self, current_time):\n        if current_time - self.last_forecast_time < self.forecast_interval:\n            return\n\n        self.last_forecast_time = current_time\n        self.carbon_forecast.clear()\n\n        times = []\n        carbons = []\n        for t in range(current_time, current_time + self.forecast_horizon + 1, 10000):\n            c = self.carbon_schedule.get(t, 300)\n            times.append(t)\n            carbons.append(c)\n\n        if len(carbons) < 2:\n            return\n\n        window_size = 3\n        ma = []\n        for i in range(len(carbons)):\n            start = max(0, i - window_size + 1)\n            ma.append(np.mean(carbons[start:i+1]))\n\n        gradient = np.gradient(ma)\n\n        low_windows = []\n        in_window = False\n        window_start = 0\n        for i, (t, c, m) in enumerate(zip(times, carbons, ma)):\n            if c < self.low_window_threshold and m < self.low_window_threshold:\n                if not in_window:\n                    in_window = True\n                    window_start = t\n            else:\n                if in_window:\n                    low_windows.append((window_start, t))\n                    in_window = False\n        if in_window:\n            low_windows.append((window_start, times[-1]))\n\n        next_low_window = None\n        for start, end in low_windows:\n            if start > current_time:\n                next_low_window = (start, end)\n                break\n\n        for i, t in enumerate(times):\n            if i >= len(gradient):\n                continue\n            score = 0.0\n            if carbons[i] < self.low_window_threshold:\n                score = -2.0\n            elif carbons[i] > self.high_window_threshold:\n                score = 2.0\n            else:\n                score = (carbons[i] - 300) / 100\n\n            if next_low_window:\n                dist_to_start = max(0, next_low_window[0] - t) / 100000.0\n                if t >= next_low_window[0] and t <= next_low_window[1]:\n                    score -= 3.0\n                elif t < next_low_window[0]:\n                    score -= 1.0 / (1.0 + dist_to_start)\n\n            self.carbon_forecast[t] = {\n                'carbon': carbons[i],\n                'score': score,\n                'gradient': gradient[i],\n                'in_low_window': carbons[i] < self.low_window_threshold\n            }\n\n    def _compute_job_metrics(self, job_dag, frontier_nodes):\n        if job_dag not in self.job_remaining_work:\n            total_tasks = 0\n            for node in job_dag.nodes:\n                total_tasks += node.num_tasks\n            self.job_remaining_work[job_dag] = total_tasks\n\n        remaining = 0\n        for node in job_dag.nodes:\n            remaining += node.num_tasks - node.next_task_idx\n\n        if job_dag not in self.job_slack:\n            self.job_slack[job_dag] = {}\n            for node in job_dag.nodes:\n                est = 0\n                lst = float('inf')\n                self.job_slack[job_dag][node] = max(0, lst - est)\n\n        if job_dag not in self.job_carbon_budget:\n            avg_low_carbon = 250\n            self.job_carbon_budget[job_dag] = remaining * avg_low_carbon\n\n        critical_path_ratio = 0.0\n        for node in frontier_nodes:\n            if node.job_dag == job_dag:\n                if self.job_slack[job_dag].get(node, 1) == 0:\n                    critical_path_ratio = 1.0\n                    break\n\n        return remaining, self.job_carbon_budget[job_dag], critical_path_ratio\n\n    def _update_carbon_budget(self, job_dag, current_carbon, exec_used, duration=1):\n        if job_dag in self.job_carbon_budget:\n            carbon_cost = current_carbon * exec_used * duration\n            self.job_carbon_budget[job_dag] -= carbon_cost\n            if self.job_carbon_budget[job_dag] < 0:\n                self.job_carbon_budget[job_dag] = 0\n\n    def _calculate_job_priority(self, job_dag, current_time, current_carbon, frontier_nodes):\n        remaining, budget, critical = self._compute_job_metrics(job_dag, frontier_nodes)\n\n        budget_ratio = 0.0\n        if self.job_remaining_work[job_dag] > 0:\n            budget_ratio = budget / (self.job_remaining_work[job_dag] * 300)\n\n        time_to_low = float('inf')\n        low_window_score = 0.0\n        for t, data in self.carbon_forecast.items():\n            if t >= current_time and data['in_low_window']:\n                time_to_low = t - current_time\n                low_window_score = -data['score']\n                break\n\n        alignment = 0.0\n        if time_to_low < 100000:\n            alignment = 1.0 - (time_to_low / 100000.0)\n\n        priority = (\n            0.6 * (remaining / max(1, self.job_remaining_work[job_dag])) +\n            0.3 * critical -\n            0.4 * budget_ratio +\n            0.3 * alignment\n        )\n\n        if current_carbon > self.high_window_threshold and budget_ratio < 0.2:\n            priority -= 1.0\n\n        return priority\n\n    def _adjust_capacity(self, current_time, current_carbon):\n        self._update_carbon_forecast(current_time)\n\n        if not self.carbon_forecast:\n            self.exec_cap = self.exec_cap_MAX\n            return\n\n        now_data = None\n        for t, data in sorted(self.carbon_forecast.items()):\n            if t >= current_time:\n                now_data = data\n                break\n        if not now_data:\n            now_data = list(self.carbon_forecast.values())[-1]\n\n        base = self.exec_cap_MAX\n        multiplier = 1.0\n\n        if now_data['carbon'] > self.high_window_threshold:\n            gradient_factor = 1.0 + now_data['gradient'] / 100.0\n            multiplier *= max(0.3, 1.0 / gradient_factor)\n\n            time_to_low = float('inf')\n            for t, data in self.carbon_forecast.items():\n                if t > current_time and data['in_low_window']:\n                    time_to_low = t - current_time\n                    break\n\n            if time_to_low < 50000:\n                multiplier *= max(0.2, time_to_low / 50000.0)\n\n        elif now_data['carbon'] < self.low_window_threshold:\n            backlog_factor = 1.0\n            total_used = sum(self.exec_map.values())\n            if total_used > 0:\n                backlog_factor = min(2.0, 1.0 + (total_used / self.exec_cap_MAX))\n            multiplier *= backlog_factor\n\n            if now_data['gradient'] < -10:\n                multiplier *= 1.2\n\n        else:\n            if now_data['gradient'] < 0:\n                multiplier *= 1.1\n            elif now_data['gradient'] > 0:\n                multiplier *= 0.9\n\n        new_cap = int(base * multiplier)\n        new_cap = max(self.B, min(self.exec_cap_MAX, new_cap))\n\n        smooth_factor = 0.3\n        self.exec_cap = int(smooth_factor * new_cap + (1 - smooth_factor) * self.exec_cap)\n        self.exec_cap = max(self.B, min(self.exec_cap_MAX, self.exec_cap))\n\n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n                if job_dag in self.job_slack:\n                    del self.job_slack[job_dag]\n                if job_dag in self.job_carbon_budget:\n                    del self.job_carbon_budget[job_dag]\n                if job_dag in self.job_remaining_work:\n                    del self.job_remaining_work[job_dag]\n\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        self._adjust_capacity(current_time, current_carbon)\n\n        total_used = sum(self.exec_map.values())\n        carbon_aware_pause = False\n\n        if current_carbon >= U:\n            low_window_soon = False\n            for t, data in self.carbon_forecast.items():\n                if t > current_time and t - current_time < 30000 and data['in_low_window']:\n                    low_window_soon = True\n                    break\n            if low_window_soon and total_used > self.exec_cap * 0.7:\n                carbon_aware_pause = True\n\n        if total_used >= self.exec_cap or carbon_aware_pause:\n            if source_job is not None and source_job in self.exec_map:\n                self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n            return None, num_source_exec, True\n\n        if source_job is not None:\n            for node in frontier_nodes:\n                if node.job_dag == source_job:\n                    remaining = node.num_tasks - node.next_task_idx\n                    commit = exec_commit.node_commit.get(node, 0)\n                    moving = moving_executors.count(node)\n                    available = remaining - commit - moving\n\n                    if available <= 0:\n                        continue\n\n                    use_exec = min(available, num_source_exec, self.exec_cap - self.exec_map[source_job])\n\n                    if use_exec > 0:\n                        self.exec_map[source_job] += use_exec\n                        carbon_aware_flag = (current_carbon >= U)\n                        if carbon_aware_flag:\n                            self._update_carbon_budget(source_job, current_carbon, use_exec)\n                        return node, use_exec, carbon_aware_flag\n\n        job_priorities = []\n        for job_dag in job_dags:\n            if self.exec_map[job_dag] >= self.exec_cap:\n                continue\n\n            priority = self._calculate_job_priority(job_dag, current_time, current_carbon, frontier_nodes)\n            heapq.heappush(job_priorities, (-priority, job_dag))\n\n        while job_priorities:\n            _, job_dag = heapq.heappop(job_priorities)\n\n            selected_node = None\n            for node in frontier_nodes:\n                if node.job_dag == job_dag:\n                    selected_node = node\n                    break\n\n            if selected_node is None:\n                continue\n\n            remaining = selected_node.num_tasks - selected_node.next_task_idx\n            commit = exec_commit.node_commit.get(selected_node, 0)\n            moving = moving_executors.count(selected_node)\n            available = remaining - commit - moving\n\n            if available <= 0:\n                continue\n\n            max_for_job = self.exec_cap - self.exec_map[job_dag]\n            use_exec = min(available, num_source_exec, max_for_job)\n\n            if use_exec <= 0:\n                continue\n\n            node_slack = self.job_slack[job_dag].get(selected_node, 1)\n            if current_carbon >= U and node_slack > 0:\n                use_exec = max(1, int(use_exec * 0.3))\n\n            self.exec_map[job_dag] += use_exec\n            carbon_aware_flag = (current_carbon >= U) or (current_carbon > 350 and node_slack > 0)\n\n            if carbon_aware_flag:\n                self._update_carbon_budget(job_dag, current_carbon, use_exec)\n\n            return selected_node, use_exec, carbon_aware_flag\n\n        return None, num_source_exec, False\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport math\nfrom collections import deque\n\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n        self.carbon_history = deque(maxlen=10)\n        self.emergency_threshold = 450\n        self.forecast_horizon = 60000\n        self.forecast_step = 5000\n        self.task_runtime_estimate = 10000\n\n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        self.carbon_history.append(current_carbon)\n        L = 250\n        U = 380\n        if len(self.carbon_history) > 1:\n            L = min(self.carbon_history) * 0.9\n            U = max(self.carbon_history) * 1.1\n        return current_carbon, L, U\n\n    def _get_future_carbon_window(self, current_time, window_duration):\n        best_future_carbon = float('inf')\n        steps = int(window_duration / self.forecast_step)\n        for i in range(1, steps + 1):\n            lookup_time = current_time + i * self.forecast_step\n            carbon = self.carbon_schedule.get(lookup_time, 300)\n            if carbon < best_future_carbon:\n                best_future_carbon = carbon\n        return best_future_carbon\n\n    def _compute_task_score(self, node, current_carbon, current_time, available_executors):\n        task_remaining = node.num_tasks - node.next_task_idx\n        resource_footprint = min(task_remaining, available_executors, 4)\n        future_carbon = self._get_future_carbon_window(current_time, self.task_runtime_estimate)\n        score = resource_footprint * (current_carbon - future_carbon)\n        return score, resource_footprint\n\n    def _update_global_throttle(self, current_carbon):\n        if current_carbon >= self.emergency_threshold:\n            self.exec_cap = max(self.B, int(self.exec_cap_MAX * 0.3))\n        elif current_carbon >= 350:\n            self.exec_cap = max(self.B, int(self.exec_cap_MAX * 0.7))\n        else:\n            self.exec_cap = self.exec_cap_MAX\n\n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        self._update_global_throttle(current_carbon)\n\n        total_used_exec = sum(self.exec_map.values())\n        if total_used_exec >= self.exec_cap:\n            if source_job is not None and source_job in self.exec_map:\n                self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n            return None, num_source_exec, True\n min\n        U = self.ci_max\n        return ci_now, L, U, ci_future\n\n    def compute_node_criticality(self, node):\n        depth = 0\n        current = node\n        while current.children:\n            if current.children:\n                current = max(current.children, key=lambda n: n.num_tasks)\n                depth += 1\n            else:\n                break\n        return 1.0 / (1.0 + math.exp(-depth / 3.0))\n\n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n\n        num_exec = sum(self.exec_map[job_dag] for job_dag in self.exec_map)\n\n        ci_now, L, U, ci_future = self.get_carbon_intensity(current_time)\n        norm_ci = (ci_now - self.ci_min) / self.ci_range\n\n        target_cap = self.exec_cap_MAX * (1.0 - norm_ci * 0.7)\n        target_cap = max(self.B, min(self.exec_cap_MAX, target_cap))\n        self.exec_cap = self.alpha * target_cap + (1 - self.alpha) * self.exec_cap\n        self.exec_cap = max(self.B, min(self.exec_cap_MAX, int(self.exec_cap)))\n\n        if num_exec >= self.exec_cap:\n            if source_job is not None and source_job in self.exec_map:\n                self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n            return None, num_source_exec, True\n\n        if not frontier_nodes:\n            return None, num_source_exec, False\n\n        candidate_scores = []\n        for node in frontier_nodes:\n            job_dag = node.job_dag\n            if self.exec_map[job_dag] >= executor_limits[job_dag]:\n                continue\n\n            carbon_urgency = (ci_future - ci_now) / self.ci_range if self.ci_rang  implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport math\nfrom collections import deque, defaultdict\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n        self.carbon_history = deque(maxlen=100)\n        self.deferred_non_critical = deque()\n        self.window_history = deque(maxlen=5)\n        self.forecast_step = 5000\n        self.task_runtime_estimate = 15000\n        self.high_threshold = 380\n        self.emergency_threshold = 450\n        self.guaranteed_cap = int(exec_cap * 0.4)\n        self.flexible_cap = exec_cap - self.guaranteed_cap\n\n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        self.carbon_history.append(current_carbon)\n        if len(self.carbon_history) < 5:\n            L = 250\n            U = 380\n        else:\n            hist_arr = np.array(self.carbon_history)\n            L = float(np.percentile(hist_arr, 25))\n            U = float(np.percentile(hist_arr, 75))\n            if L >= U:\n                L = U - 10\n        return current_carbon, L, U\n\n    def _identify_low_carbon_windows(self, current_time, num_windows=3):\n        windows = []\n        horizon = 180000\n        step = self.forecast_step\n        times = [current_time + i * step for i in range(0, int(horizon / step))]\n        carbons = [self.carbon_schedule.get(t, 300) for t in times]\n        if len(carbons) < 10:\n            return windows\n        avg_carbon = np.mean(carbons)\n        std_carbon = np.std(carbons)\n        threshold = avg_carbon - 0.5 * std_carbon\n        i = 0\n        while i < len(carbons) and len(windows _exec, carbon_aware_flag\n        return None, num_source_exec, False\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport math\n\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n        self.carbon_values = np.array(list(carbon_schedule.values()))\n        self.carbon_timestamps = np.array(list(carbon_schedule.keys()))\n        self.ci_min = np.min(self.carbon_values)\n        self.ci_max = np.max(self.carbon_values)\n        self.ci_range = self.ci_max - self.ci_min if self.ci_max > self.ci_min else 1.0\n        self.alpha = 0.3\n        self.score_weights = [0.5, 0.3, 0.2]\n        self.min_throughput_factor = 0.4\n\n    def get_carbon_intensity(self, current_time):\n        idx = np.searchsorted(self.carbon_timestamps, current_time, side='right') - 1\n        idx = max(0, min(idx, len(self.carbon_values) - 1))\n        ci_now = self.carbon_values[idx]\n        L = self.ci_min\n        U = self.ci_max\n        return ci_now, L, U\n\n    def compute_node_criticality(self, node):\n        depth = 0\n        current = node\n        while current.children:\n            if current.children:\n                current = max(current.children, key=lambda n: n.num_tasks)\n                depth += 1\n            else:\n                break\n        return 1.0 / (1.0 + math.exp(-depth / 3.0))\n\n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n\n        num_exec = sum(self.exec_map[job_dag] for job_dag in self.exec_map)\n\n        ci_now, L, U = self.get_carbon_intensity(current_time)\n        norm_ci = (ci_now - self.ci_min) / self.ci_range\n\n        target_cap = self.exec_cap_MAX * (1.0 - norm_ci * 0.7)\n        target_cap = max(self.B, min(self.exec_cap_MAX, target_cap))\n        self.exec_cap = self.alpha * target_cap + (1 - self.alpha) * self.exec_cap\n        self.exec_cap = max(self.B, min(self.exec_cap_MAX, int(self.exec_cap)))\n\n        if num_exec >= self.exec_cap:\n            if source_job is not None and source_job in self.exec_map:\n                self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n            return None, num_source_exec, True\n\n        if not frontier_nodes:\n            return None, num_source_exec, False\n\n        candidate_scores = []\n        for node in frontier_nodes:\n            job_dag = node.job_dag\n            if self.exec_map[job_dag] >= executor_limits[job_dag]:\n                continue\n\n            task_req = node.num_tasks - node.next_task_idx - exec_commit.node_commit[node] - moving_executors.count(node)\n            if task_req <= 0:\n                continue\n\n            ideal_batch = min(num_source_exec, task_req)\n            task_criticality = self.compute_node_criticality(node)\n            resource_efficiency = 1.0 - abs(ideal_batch - num_source_exec) / max(num_source_exec, 1)\n\n            score = (self.score_weights[0] * norm_ci +\n                     self.score_weights[1] * task_criticality +\n                     self.score_weights[2] * resource_efficiency)\n            candidate_scores.append((score, node, job_dag, ideal_batch))\n\n        if not candidate_scores:\n            return None, num_source_exec, False\n\n        candidate_scores.sort(key=lambda x: x[0], reverse=True)\n\n        best_score, best_node, best_job_dag, best_batch = candidate_scores[0]\n\n        if best_batch > 0:\n            use_exec = min(best_batch, num_source_exec)\n            self.exec_map[best_job_dag] += use_exec\n            carbon_aware_flag = norm_ci > 0.5\n            return best_node, use_exec, carbon_aware_flag\n\n        return None, num_source_exec, True\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport math\nfrom collections import deque\n\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n        self.carbon_history = deque(maxlen=20)\n        self.deferral_backlog = 0\n        self.recent_deferrals = deque(maxlen=50)\n        self.task_runtime_estimate = 10000\n        self.forecast_step = 5000\n        self.forecast_horizon = 60000\n        self.deferral_threshold = 50.0\n        self.urgency_weight = 0.3\n        self.max_delay_tolerance = 0.8\n\n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        self.carbon_history.append(current_carbon)\n        if len(self.carbon_history) > 1:\n            L = min(self.carbon_history) * 0.9\n            U = max(self.carbon_history) * 1.1\n        else:\n            L = 250\n            U = 380\n        return current_carbon, L, U\n\n    def _get_future_carbon_window(self, current_time, window_duration):\n        best_future_carbon = float('inf')\n        best_future_time = current_time\n        steps = int(window_duration / self.forecast_step)\n        for i in range(1, steps + 1):\n            lookup_time = current_time + i * self.forecast_step\n            carbon = self.carbon_schedule.get(lookup_time, 300)\n            if carbon < best_future_carbon:\n                best_future_carbon = carbon\n                best_future_time = lookup_time\n        return best_future_carbon, best_future_time\n\n    def _compute_job_progress(self, job_dag, current_time):\n        if job_dag is None:\n            return 0.0, 0.0\n        total_tasks = sum(node.num_tasks for node in job_dag.nodes)\n        completed_tasks = sum(node.next_task_idx for node in job_dag.nodes)\n        if total_tasks == 0:\n            return 1.0, 0.0\n        progress_fraction = completed_tasks / total_tasks\n        job_age = current_time - job_dag.start_time if hasattr(job_dag, 'start_time') else 0\n        return progress_fraction, job_age\n\n    def _compute_deferral_score(self, node, current_carbon, current_time, job_progress, job_age):\n        future_carbon, future_time = self._get_future_carbon_window(current_time, self.forecast_horizon)\n        carbon_savings = current_carbon - future_carbon\n        if carbon_savings <= 0:\n            return -1.0\n        \n        delay_duration = future_time - current_time\n        if delay_duration <= 0:\n            return -1.0\n        \n        delay_tolerance = max(0.0, 1.0 - job_progress)\n        delay_tolerance = min(delay_tolerance, self.max_delay_tolerance)\n        \n        age_factor = max(0.1, 1.0 - (job_age / (self.forecast_horizon * 5)))\n        \n        task_remaining = node.num_tasks - node.next_task_idx\n        estimated_duration = task_remaining * self.task_runtime_estimate\n        delay_cost = delay_duration / (estimated_duration + 1)\n        \n        deferral_score = carbon_savings * delay_tolerance * age_factor - delay_cost * self.urgency_weight\n        return deferral_score\n\n    def _adjust_threshold(self, current_carbon):\n        if len(self.recent_deferrals) > 10:\n            deferral_rate = sum(self.recent_deferrals) / len(self.recent_deferrals)\n            if deferral_rate > 0.7 and self.deferral_backlog > 5:\n                self.deferral_threshold *= 0.9\n            elif deferral_rate < 0.2:\n                self.deferral_threshold *= 1.1\n        self.deferral_threshold = max(10.0, min(200.0, self.deferral_threshold))\n\n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        self._adjust_threshold(current_carbon)\n\n        total_used_exec = sum(self.exec_map.values())\n        if total_used_exec >= self.exec_cap:\n            if source_job is not None and source_job in self.exec_map:\n                self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n            return None, num_source_exec, True\n\n        if not frontier_nodes:\n            return None, num_source_exec, False\n\n        available_for_new = self.exec_cap - total_used_exec\n        if available_for_new <= 0:\n            return None, num_source_exec, True\n\n        if source_job is not None:\n            job_progress, job_age = self._compute_job_progress(source_job, current_time)\n        else:\n            job_progress, job_age = 0.0, 0.0\n\n        scored_tasks = []\n        for node in frontier_nodes:\n            job_dag = node.job_dag\n            if job_dag is None:\n                continue\n            job_used = self.exec_map.get(job_dag, 0)\n            available_for_job = min(available_for_new, self.exec_cap - job_used)\n            if available_for_job <= 0:\n                continue\n            \n            deferral_score = self._compute_deferral_score(node, current_carbon, current_time, job_progress, job_age)\n            \n            if deferral_score > self.deferral_threshold:\n                self.recent_deferrals.append(1)\n                self.deferral_backlog += 1\n                continue\n            \n            self.recent_deferrals.append(0)\n            \n            task_remaining = node.num_tasks - node.next_task_idx\n            resource_footprint = min(task_remaining, available_for_job, 4)\n            carbon_efficiency = max(0.1, 1.0 - (current_carbon / (U + 1)))\n            alloc = max(1, int(resource_footprint * carbon_efficiency))\n            alloc = min(alloc, available_for_job, num_source_exec)\n            \n            scored_tasks.append((alloc, node, job_dag))\n\n        if not scored_tasks:\n            self.deferral_backlog = max(0, self.deferral_backlog - 1)\n            return None, num_source_exec, False\n\n        scored_tasks.sort(key=lambda x: x[0], reverse=True)\n        best_allocation, best_task, best_job = scored_tasks[0]\n\n        if best_task is not None and best_allocation > 0:\n            self.exec_map[best_job] = self.exec_map.get(best_job, 0) + best_allocation\n            carbon_aware_flag = current_carbon >= U\n            self.deferral_backlog = max(0, self.deferral_backlog - 1)\n            return best_task, best_allocation, carbon_aware_flag\n\n        return None, num_source_exec, False\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport math\nfrom collections import deque, defaultdict\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n        self.carbon_history = deque(maxlen=100)\n        self.deferred_non_critical = deque()\n        self.window_history = deque(maxlen=5)\n        self.forecast_step = 5000\n        self.task_runtime_estimate = 15000\n        self.high_threshold = 380\n        self.emergency_threshold = 450\n        self.guaranteed_cap = int(exec_cap * 0.4)\n        self.flexible_cap = exec_cap - self.guaranteed_cap\n\n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        self.carbon_history.append(current_carbon)\n        if len(self.carbon_history) < 5:\n            L = 250\n            U = 380\n        else:\n            hist_arr = np.array(self.carbon_history)\n            L = float(np.percentile(hist_arr, 25))\n            U = float(np.percentile(hist_arr, 75))\n            if L >= U:\n                L = U - 10\n        return current_carbon, L, U\n\n    def _identify_low_carbon_windows(self, current_time, num_windows=3):\n        windows = []\n        horizon = 180000\n        step = self.forecast_step\n        times = [current_time + i * step for i in range(0, int(horizon / step))]\n        carbons = [self.carbon_schedule.get(t, 300) for t in times]\n        if len(carbons) < 10:\n            return windows\n        avg_carbon = np.mean(carbons)\n        std_carbon = np.std(carbons)\n        threshold = avg_carbon - 0.5 * std_carbon\n        i = 0\n        while i < len(carbons) and len(windows) < num_windows:\n            if carbons[i] < threshold:\n                start_idx = i\n                while i < len(carbons) and carbons[i] < threshold:\n                    i += 1\n                end_idx = i - 1\n                if end_idx - start_idx >= 2:\n                    win_start = times[start_idx]\n                    win_end = times[end_idx]\n                    win_avg = np.mean(carbons[start_idx:end_idx+1])\n                    windows.append((win_start, win_end, win_avg))\n            else:\n                i += 1\n        if not windows:\n            future_min_idx = np.argmin(carbons)\n            win_start = times[max(0, future_min_idx - 2)]\n            win_end = times[min(len(times)-1, future_min_idx + 2)]\n            win_avg = carbons[future_min_idx]\n            windows.append((win_start, win_end, win_avg))\n        return windows\n\n    def _compute_critical_path_priority(self, node, job_dag, exec_commit, moving_executors):\n        remaining_tasks = node.num_tasks - node.next_task_idx\n        committed = exec_commit.node_commit.get(node, 0) + moving_executors.count(node)\n        free_tasks = remaining_tasks - committed\n        if free_tasks <= 0:\n            return 0.0\n        job_frontier = [n for n in job_dag.frontier_nodes if n.num_tasks - n.next_task_idx > 0]\n        if len(job_frontier) == 1:\n            return 1.0\n        depth = node.next_task_idx\n        max_depth = max(n.next_task_idx for n in job_frontier) if job_frontier else 1\n        depth_score = (depth + 1) / (max_depth + 1)\n        child_count = len(node.children) if hasattr(node, 'children') else 0\n        child_score = 1.0 / (1.0 + child_count)\n        return 0.6 * depth_score + 0.4 * child_score\n\n    def _update_dynamic_caps(self, current_carbon, total_critical_demand):\n        if current_carbon >= self.emergency_threshold:\n            self.exec_cap = self.B\n            self.guaranteed_cap = self.B\n            self.flexible_cap = 0\n        elif current_carbon >= self.high_threshold:\n            self.exec_cap = max(self.B, int(self.exec_cap_MAX * 0.5))\n            self.guaranteed_cap = min(self.exec_cap, total_critical_demand)\n            self.flexible_cap = self.exec_cap - self.guaranteed_cap\n        else:\n            carbon_ratio = current_carbon / self.high_threshold\n            flexible_ratio = max(0.1, 1.0 - carbon_ratio)\n            self.exec_cap = self.exec_cap_MAX\n            self.flexible_cap = int(self.exec_cap_MAX * flexible_ratio)\n            self.guaranteed_cap = self.exec_cap_MAX - self.flexible_cap\n        self.exec_cap = max(self.B, min(self.exec_cap_MAX, self.exec_cap))\n        self.guaranteed_cap = max(1, min(self.exec_cap, self.guaranteed_cap))\n        self.flexible_cap = max(0, self.exec_cap - self.guaranteed_cap)\n\n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n        if source_job is not None and source_job in self.exec_map:\n            self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        low_carbon_windows = self._identify_low_carbon_windows(current_time, 2)\n        next_window = low_carbon_windows[0] if low_carbon_windows else (current_time, current_time + 30000, 300)\n        total_used_exec = sum(self.exec_map.values())\n        available_global = self.exec_cap - total_used_exec\n        if available_global <= 0 or num_source_exec <= 0:\n            return None, num_source_exec, True\n        critical_tasks = []\n        non_critical_tasks = []\n        for node in frontier_nodes:\n            job_dag = node.job_dag\n            cp_priority = self._compute_critical_path_priority(node, job_dag, exec_commit, moving_executors)\n            remaining = node.num_tasks - node.next_task_idx\n            committed = exec_commit.node_commit.get(node, 0) + moving_executors.count(node)\n            free_tasks = remaining - committed\n            if free_tasks <= 0:\n                continue\n            if cp_priority > 0.7:\n                critical_tasks.append((cp_priority, free_tasks, node, job_dag))\n            else:\n                non_critical_tasks.append((cp_priority, free_tasks, node, job_dag))\n        critical_tasks.sort(key=lambda x: x[0], reverse=True)\n        non_critical_tasks.sort(key=lambda x: x[0])\n        total_critical_demand = sum(ft for _, ft, _, _ in critical_tasks) if critical_tasks else 1\n        self._update_dynamic_caps(current_carbon, total_critical_demand)\n        guaranteed_remaining = self.guaranteed_cap\n        flexible_remaining = self.flexible_cap\n        selected_node = None\n        use_exec = 0\n        carbon_aware_flag = False\n        for cp_priority, free_tasks, node, job_dag in critical_tasks:\n            if guaranteed_remaining <= 0:\n                break\n            job_used = self.exec_map.get(job_dag, 0)\n            available_for_job = min(available_global, self.exec_cap - job_used, guaranteed_remaining)\n            if available_for_job <= 0:\n                continue\n            est_completion = current_time + self.task_runtime_estimate\n            window_end = next_window[1]\n            in_window = est_completion <= window_end\n            future_carbon = self.carbon_schedule.get(est_completion, current_carbon)\n            carbon_ok = future_carbon <= current_carbon * 1.2\n            if in_window or carbon_ok:\n                alloc = min(free_tasks, num_source_exec, available_for_job, int(available_for_job * cp_priority))\n                if alloc > 0:\n                    selected_node = node\n                    use_exec = alloc\n                    self.exec_map[job_dag] = job_used + alloc\n                    carbon_aware_flag = current_carbon > L\n                    guaranteed_remaining -= alloc\n                    break\n        if selected_node is None and flexible_remaining > 0 and current_carbon < self.high_threshold:\n            for cp_priority, free_tasks, node, job_dag in non_critical_tasks:\n                if flexible_remaining <= 0:\n                    break\n                job_used = self.exec_map.get(job_dag, 0)\n                available_for_job = min(available_global, self.exec_cap - job_used, flexible_remaining)\n                if available_for_job <= 0:\n                    continue\n                window_avg = next_window[2]\n                if current_carbon < window_avg * 1.15:\n                    alloc = min(free_tasks, num_source_exec, available_for_job, 2)\n                    if alloc > 0:\n                        selected_node = node\n                        use_exec = alloc\n                        self.exec_map[job_dag] = job_used + alloc\n                        carbon_aware_flag = True\n                        flexible_remaining -= alloc\n                        break\n        if selected_node is None and non_critical_tasks:\n            deferred_count = len(self.deferred_non_critical)\n            if deferred_count > 10:\n                _, free_tasks, node, job_dag = non_critical_tasks[0]\n                job_used = self.exec_map.get(job_dag, 0)\n                available_for_job = min(available_global, self.exec_cap - job_used)\n                if available_for_job > 0:\n                    alloc = min(free_tasks, num_source_exec, 1)\n                    if alloc > 0:\n                        selected_node = node\n                        use_exec = alloc\n                        self.exec_map[job_dag] = job_used + alloc\n                        carbon_aware_flag = True\n        if selected_node is not None:\n            return selected_node, use_exec, carbon_aware_flag\n        return None, num_source_exec, False\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport math\nfrom collections import deque, defaultdict\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n        self.carbon_history = deque(maxlen=50)\n        self.job_carbon_debt = defaultdict(float)\n        self.job_last_exec_time = defaultdict(float)\n        self.task_duration_estimates = {}\n        self.carbon_trend_buffer = deque(maxlen=10)\n        self.low_carbon_threshold = 300\n        self.high_carbon_threshold = 400\n        self.min_executors_per_task = 1\n        self.max_executors_per_task = 4\n\n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        self.carbon_history.append(current_carbon)\n        if len(self.carbon_history) < 5:\n            L = 250\n            U = 380\n        else:\n            hist_arr = np.array(self.carbon_history)\n            L = float(np.percentile(hist_arr, 20))\n            U = float(np.percentile(hist_arr, 80))\n            if L >= U:\n                L = U - 10\n        return current_carbon, L, U\n\n    def _compute_carbon_trend(self, current_time):\n        horizon = 30000\n        step = 5000\n        future_times = [current_time + i * step for i in range(1, int(horizon / step) + 1)]\n        future_carbons = [self.carbon_schedule.get(t, 300) for t in future_times]\n        if len(future_carbons) >= 3:\n            trend = np.polyfit(range(len(future_carbons)), future_carbons, 1)[0]\n            return trend\n        return 0.0\n\n    def _compute_task_utility(self, node, job_dag, current_carbon, carbon_trend, exec_commit, moving_executors):\n        remaining = node.num_tasks - node.next_task_idx\n        committed = exec_commit.node_commit.get(node, 0) + moving_executors.count(node)\n        free_tasks = remaining - committed\n        if free_tasks <= 0:\n            return 0.0, 0\n\n        estimated_duration = self.task_duration_estimates.get(node, 15000)\n        time_value = 1.0 / (estimated_duration * 0.0001 + 1.0)\n\n        job_frontier = [n for n in job_dag.frontier_nodes if n.num_tasks - n.next_task_idx > 0]\n        if job_frontier:\n            max_dependents = max(len(n.children) if hasattr(n, 'children') else 0 for n in job_frontier)\n            dependency_value = (len(node.children) if hasattr(node, 'children') else 0) / (max_dependents + 1)\n        else:\n            dependency_value = 0.5\n\n        depth = node.next_task_idx\n        max_depth = max(n.next_task_idx for n in job_frontier) if job_frontier else 1\n        depth_score = (depth + 1) / (max_depth + 1)\n\n        carbon_ratio = current_carbon / self.high_carbon_threshold\n        carbon_penalty = max(0.1, carbon_ratio)\n\n        job_debt = self.job_carbon_debt.get(job_dag, 0.0)\n        debt_bonus = min(2.0, job_debt / 1000.0 + 1.0)\n\n        utility = (time_value * (dependency_value * 0.6 + depth_score * 0.4) * debt_bonus) / carbon_penalty\n\n        if carbon_trend > 0.5:\n            utility *= 1.3\n        elif carbon_trend < -0.5:\n            utility *= 0.7\n\n        alloc = max(self.min_executors_per_task, min(free_tasks, self.max_executors_per_task, int(utility * 2)))\n        return utility, alloc\n\n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n\n        if source_job is not None and source_job in self.exec_map:\n            self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        carbon_trend = self._compute_carbon_trend(current_time)\n        self.carbon_trend_buffer.append(carbon_trend)\n\n        for job_dag in job_dags:\n            if current_time - self.job_last_exec_time.get(job_dag, current_time) > 30000:\n                self.job_carbon_debt[job_dag] += current_carbon * 0.01\n\n        total_used_exec = sum(self.exec_map.values())\n        available_global = self.exec_cap - total_used_exec\n\n        if available_global <= 0 or num_source_exec <= 0:\n            return None, num_source_exec, True\n\n        task_utilities = []\n        for node in frontier_nodes:\n            job_dag = node.job_dag\n            utility, alloc = self._compute_task_utility(node, job_dag, current_carbon, carbon_trend, exec_commit, moving_executors)\n            if alloc > 0:\n                task_utilities.append((utility, alloc, node, job_dag))\n\n        task_utilities.sort(key=lambda x: x[0], reverse=True)\n\n        selected_node = None\n        use_exec = 0\n        carbon_aware_flag = False\n        allocated_this_round = 0\n\n        carbon_ratio = current_carbon / self.high_carbon_threshold\n        if carbon_ratio > 1.0:\n            max_alloc_per_task = self.min_executors_per_task\n        elif carbon_ratio < 0.5:\n            max_alloc_per_task = self.max_executors_per_task\n        else:\n            max_alloc_per_task = max(self.min_executors_per_task, int(self.max_executors_per_task * (1.0 - carbon_ratio * 0.5)))\n\n        for utility, alloc, node, job_dag in task_utilities:\n            if allocated_this_round >= num_source_exec:\n                break\n            job_used = self.exec_map.get(job_dag, 0)\n            available_for_job = min(available_global, self.exec_cap - job_used)\n            if available_for_job <= 0:\n                continue\n\n            effective_alloc = min(alloc, max_alloc_per_task, num_source_exec - allocated_this_round, available_for_job)\n            if effective_alloc <= 0:\n                continue\n\n            if current_carbon > U and utility < 1.0:\n m agents.agent import Agent\nimport math\nfrom collections import defaultdict\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n        self.min_executors = 1\n        self.max_executors = 4\n        self.task_durations = {}\n\n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        times = sorted(self.carbon_schedule.keys())\n        future_times = [t for t in times if t > current_time and t <= current_time + 3600000]\n        if len(future_times) >= 2:\n            future_carbons = [self.carbon_schedule[t] for t in future_times]\n            L = float(np.percentile(future_carbons, 20))\n            U = float(np.percentile(future_carbons, 80))\n            if L >= U:\n                L = U - 10\n        else:\n            L = current_carbon * 0.8\n            U = current_carbon * 1.2\n            if L >= U:\n                L = U - 10\n        return current_carbon, L, U\n\n    def _compute_forecast_avg(self, current_time, horizon):\n        times = sorted(self.carbon_schedule.keys())\n        relevant_times = [t for t in times if t >= current_time and t <= current_time + horizon]\n        if not relevant_times:\n            return self.carbon_schedule.get(current_time, 300)\n        values = [self.carbon_schedule[t] for t in relevant_times]\n        return float(np.mean(values))\n\n    def _compute_slack_and_critical_path(self, node, job_dag, current_time):\n        if not hasattr(job_dag, 'frontier_nodes') or not job_dag.frontier_nodes:\n            return 0, True\n        frontier = [n for n in job_dag.frontier_nodes if n.num_tasks - n.next_task_idx > 0]\n        if not frontier:\n            return 0, True\n        depths = {n: n.next_task_idx for n in frontier}\n        max_depth = max(depths.values()) if depths else 0\n        current_depth = node.next_task_idx\n        slack = max_depth - current_depth\n        slack_time = slack * 15000\n        is_critical = (slack == 0)\n        return slack_time, is_critical\n\n    def _estimate_task_duration(self, node):\n        if node not in self.task_durations:\n            self.task_durations[node] = 15000\n        return self.task_durations[node]\n\n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n\n        if source_job is not None and source_job in self.exec_map:\n            self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n\n        total_used_exec = sum(self.exec_map.values())\n        available_global = self.exec_cap - total_used_exec\n\n        if available_global <= 0 or num_source_exec <= 0:\n            return None, num_source_exec, True\n\n        candidate_tasks = []\n        for node in frontier_nodes:\n            job_dag = node.job_dag\n            slack_time, is_critical = self._compute_slack_and_critical_path(node, job_dag, current_time)\n            duration = self._estimate_task_duration(node)\n            \n            if is_critical:\n                forecast_avg = current_carbon\n                carbon_gap = float('inf')\n            else:\n                horizon = max(slack_time, 30000)\n                forecast_avg = self._compute_forecast_avg(current_time, horizon)\n                carbon_gap = forecast_avg - current_carbon\n            \n            candidate_tasks.append((node, job_dag, is_critical, carbon_gap, duration, slack_time))\n\n        candidate_tasks.sort(key=lambda x: (not x[2], -x[3], -x[4]))\n\n        allocated_this_round = 0\n        selected_node = None\n        use_exec = 0\n        carbon_aware_flag = False\n\n        for node, job_dag, is_critical, carbon_gap, duration, slack_time in candidate_tasks:\n            if allocated_this_round >= num_source_exec:\n                break\n            \n            job_used = self.exec_map.get(job_dag, 0)\n            available_for_job = min(available_global, self.exec_cap - job_used)\n            if available_for_job <= 0:\n                continue\n\n            if carbon_gap < 0 and not is_critical:\n                continue\n\n            if is_critical:\n                alloc = min(self.max_executors, num_source_exec - allocated_this_round, available_for_job)\n            else:\n                if slack_time > 0:\n                    base_alloc = max(1, math.ceil(duration / slack_time))\n                else:\n                    base_alloc = self.min_executors\n                alloc = min(base_alloc, self.max_executors, num_source_exec - allocated_this_round, available_for_job)\n            \n            if alloc <= 0:\n                continue\n\n            selected_node = node\n            use_exec = alloc\n            self.exec_map[job_dag] = job_used + alloc\n            allocated_this_round += alloc\n            carbon_aware_flag = (carbon_gap >= 0)\n            break\n\n        if selected_node is None and candidate_tasks:\n            for node, job_dag, is_critical, carbon_gap, duration, slack_time in candidate_tasks:\n                if allocated_this_round >= num_source_exec:\n                    break\n                job_used = self.exec_map.get(job_dag, 0)\n                available_for_job = min(available_global, self.exec_cap - job_used)\n                if available_for_job <= 0:\n                    continue\n       L = float(np.percentile(future_carbons, 10))\n            U = float(np.percentile(future_carbons, 90))\n            if L >= U:\n                L = U - 10\n        else:\n            L = current_carbon * 0.7\n            U = current_carbon * 1.3\n            if L >= U:\n                L = U - 10\n        return current_carbon, L, U\n\n    def _compute_carbon_price(self, current_time):\n        times = sorted(self.carbon_schedule.keys())\n        forecast_times = [t for t in times if t > current_time and t <= current_time + 86400000]\n        if len(forecast_times) < 10:\n            return 1.0\n        \n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        forecast_carbons = [self.carbon_schedule[t] for t in forecast_times]\n        \n        percentile = sum(1 for c in forecast_carbons if c < current_carbon) / len(forecast_carbons)\n        \n        if percentile <= 0.1:\n            price = 0.3\n        elif percentile <= 0.3:\n            price = 0.5 + (percentile - 0.1) * 2.5\n        elif percentile <= 0.7:\n            price = 1.0 + (percentile - 0.3) * 1.25\n        elif percentile <= 0.9:\n            price = 1.5 + (percentile - 0.7) * 5.0\n        else:\n            price = 2.5 + (percentile - 0.9) * 5.0\n        \n        price = max(0.1, min(5.0, price))\n        \n        if self.carbon_price_history:\n            smoothed = 0.7 * price + 0.3 * self.carbon_price_history[-1]\n        else:\n            smoothed = price\n        \n        self.carbon_price_history.append(smoothed)\n        if len(self.carbon_price_history) > 100:\n            self.carbon_price_history.pop(0)\n        \n        return smoothed\n\n    def _compute_global_urgency(self, node, job_dag, current_time):\n        key = (id(node), id(job_dag))\n        if key in self.urgency_cache:\n            cached_time, cached_urgency = self.urgency_cache[key]\n            if current_time - cached_time < 5000:\n                return cached_urgency\n        \n        if not hasattr(job_dag, 'frontier_nodes') or not job_dag.frontier_nodes:\n            return 0.0\n        \n        total_tasks = node.num_tasks if hasattr(node, 'num_tasks') else 1\n        current_depth = node.next_task_idx if hasattr(node, 'next_task_idx') else 0\n        remaining_tasks = total_tasks - current_depth\n        criticality = remaining_tasks / max(total_tasks, 1)\n        \n        if job_dag not in self.job_start_times:\n            self.job_start_times[job_dag] = current_time\n        elapsed_time = current_time - self.job_start_times[job_dag]\n        expected_total_time = total_tasks * 15000\n        time_pressure = min(elapsed_time / max(expected_total_time, 1), 2.0)\n        \n        if job_dag not in self.job_carbon_budgets:\n            min_carbon = min(self.carbon_schedule.values()) if self.carbon_schedule else 300\n            self.job_carbon_budgets[job_dag] = total_tasks * 15000 * min_carbon\n        \n        carbon_debt = self.job_carbon_used.get(job_dag, 0) / max(self.job_carbon_budgets[job_dag], 1)\n        \n        urgency = criticality * time_pressure / max(carbon_debt, 0.5)\n        \n        self.urgency_cache[key] = (current_time, urgency)\n        if len(self.urgency_cache) > 1000:\n            self.urgency_cache.pop(next(iter(self.urgency_cache)))\n        \n        return urgency\n\n    def _estimate_task_duration(self, node):\n        if node not in self.task_durations:\n            self.task_durations[node] = 15000\n        return self.task_durations[node]\n\n    def _get_forecast_avg(self, current_time, horizon):\n        times = sorted(self.carbon_schedule.keys())\n        relevant_times = [t for t in times if t >= current_time and t <= current_time + horizon]\n        if not relevant_times:\n            return self.carbon_schedule.get(current_time, 300)\n        values = [self.carbon_schedule[t] for t in relevant_times]\n        return float(np.mean(values))\n\n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n\n        if source_job is not None and source_job in self.exec_map:\n            self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        price_factor = self._compute_carbon_price(current_time)\n\n        total_used_exec = sum(self.exec_map.values())\n        available_global = self.exec_cap - total_used_exec\n\n        if available_global <= 0 or num_source_exec <= 0:\n            return None, num_source_exec, True\n\n        candidate_tasks = []\n        for node in frontier_nodes:\n            job_dag = node.job_dag\n            duration = self._estimate_task_duration(node)\n            urgency = self._compute_global_urgency(node, job_dag, current_time)\n            \n            forecast_avg = self._get_forecast_avg(current_time, 3600000)\n            carbon_cost = duration * current_carbon\n            \n            candidate_tasks.append((node, job_dag, urgency, carbon_cost, duration, forecast_avg))\n\n        candidate_tasks.sort(key=lambda x: (-x[2], x[3]))\n\n        allocated_this_round = 0\n        selected_node = None\n        use_exec = 0\n        carbon_aware_flag = False\n\n        for node, job_dag, urgency, carbon_cost, duration, forecast_avg in candidate_tasks:\n            if allocated_this_round >= num_source_exec:\n                break\n            \n            job_used = self.exec_map.get(job_dag, 0)\n            available_for_job = min(available_global, self.exec_cap - job_used)\n            if available_for_job <= 0:\n                continue\n\n            if price_factor > 1.5 and urgency < 0.3:\n                if node in self.slowed_tasks:\n                    base_alloc = self.min_executors\n                else:\n                    self.slowed_tasks.add(node)\n                    base_alloc = self.min_executors\n            elif price_factor < 0.8 and urgency > 0.7:\n                if node in self.slowed_tasks:\n                    self.slowed_tasks.discard(node)\n                    self.catchup_tasks.add(node)\n                base_alloc = min(self.max_executors, int(self.max_executors / max(price_factor, 0.1)))\n            else:\n                if node in self.slowed_tasks:\n                    self.slowed_tasks.discard(node)\n                base_alloc = max(self.min_executors, min(self.max_executors, int(self.max_executors / max(price_factor, 0.1))))\n            \n            alloc = min(base_alloc, num_source_exec - allocated_this_round, available_for_job)\n            \n            if alloc <= 0:\n                alloc = self.min_executors\n                alloc = min(alloc, num_source_exec - allocated_this_round, available_for_job)\n                if alloc <= 0:\n                    continue\n            \n            selected_node = node\n            use_exec = alloc\n            self.exec_map[job_dag] = job_used + alloc\n            allocated_this_round += alloc\n            carbon_aware_flag = True\n            self.job_carbon_used[job_dag] += alloc * duration * current_carbon\n            break\n\n        if selected_node is None and candidate_tasks:\n            for node, job_dag, urgency, carbon_cost, duration, forecast_avg in candidate_tasks:\n                if allocated_this_round >= num_source_exec:\n                    break\n                job_used = self.exec_map.get(job_dag, 0)\n                available_for_job = min(available_global, self.exec_cap - job_used)\n                if available_for_job <= 0:\n                    continue\n                alloc = min(self.min_executors, num_source_exec - allocated_this_round, available_for_job)\n                if alloc > 0:\n                    selected_node = node\n                    use_exec = alloc\n                    self.exec_map[job_dag] = job_used + alloc\n                    allocated_this_round += alloc\n                    carbon_aware_flag = True\n                    self.job_carbon_used[job_dag] += alloc * duration * current_carbon\n                    break\n\n        if selected_node is not None:\n            return selected_node, use_exec, carbon_aware_flag\n        return None, num_source_exec, False\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport math\nfrom collections import defaultdict\nimport heapq\nfrom typing import List, Tuple, Optional\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n        \n        # Task shifting state\n        self.deferred_tasks = []  # heap of (green_window_start, urgency, node, job_dag, duration)\n        self.deferred_task_set = set()  # for O(1) lookup\n        self.task_parallelism = {}  # node -> estimated parallelism factor\n        self.job_critical_paths = {}  # job_dag -> {node: critical_path_length}\n        self.job_total_remaining = {}  # job_dag -> total remaining work\n        self.job_node_depths = {}  # job_dag -> {node: depth from start}\n        self.carbon_history = []  # rolling window for percentile computation\n        self.max_carbon_history = 1440  # 24 hours at 1-minute resolution\n        self.green_threshold_percentile = 30\n        self.brown_threshold_percentile = 70\n        self.forecast_horizon_ms = 172800000  # 48 hours\n        self.window_min_duration_ms = 3600000  # 1 hour minimum green window\n        self.max_deferral_factor = 2.0  # max deferral relative to task duration\n        self.last_cleanup_time = 0\n        \n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        \n        # Update rolling carbon history\n        self.carbon_history.append((current_time, current_carbon))\n        # Keep only recent history\n        cutoff_time = current_time - self.forecast_horizon_ms\n        self.carbon_history = [(t, c) for t, c in self.carbon_history if t >= cutoff_time]\n        if len(self.carbon_history) > self.max_carbon_history:\n            self.carbon_history = self.carbon_history[-self.max_carbon_history:]\n        \n        # Get future forecast for bounds\n        times = sorted(self.carbon_schedule.keys())\n        future_times = [t for t in times if t > current_time and t <= current_time + self.forecast_horizon_ms]\n        \n        if len(future_times) >= 24:  # At least 24 future data points\n            future_carbons = [self.carbon_schedule[t] for t in future_times]\n            L = float(np.percentile(future_carbons, 10))\n            U = float(np.percentile(future_carbons, 90))\n            if L >= U:\n                L = U - 10\n        else:\n            # Fallback using history\n            if len(self.carbon_history) >= 10:\n                historical_carbons = [c for _, c in self.carbon_history]\n                L = float(np.percentile(historical_carbons, 10))\n                U = float(np.percentile(historical_carbons, 90))\n                if L >= U:\n                    L = U - 10\n            else:\n                L = current_carbon * 0.7\n                U = current_carbon * 1.3\n                if L >= U:\n                    L = U - 10\n        \n        return current_carbon, L, U\n    \n    def _get_carbon_percentile(self, current_time):\n        \"\"\"Get the percentile rank of current carbon in recent history.\"\"\"\n        if len(self.carbon_history) < 10:\n            return 50.0\n        \n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        historical_carbons = [c for _, c in self.carbon_history]\n        \n        # Use only recent history (last 12 hours)\n        recent = historical_carbons[-720:] if len(historical_carbons) > 720 else historical_carbons\n        \n        percentile = sum(1 for c in recent if c < current_carbon) / len(recent) * 100\n        return percentile\n    \n    def _find_green_windows(self, current_time):\n        \"\"\"Find upcoming green windows in the carbon forecast.\"\"\"\n        times = sorted(self.carbon_schedule.keys())\n        future_times = [t for t in times if t > current_time and t <= current_time + self.forecast_horizon_ms]\n        \n        if len(future_times) < 24:\n            return []\n        \n        future_carbons = [self.carbon_schedule[t] for t in future_times]\n        \n        # Compute threshold (30th percentile of future)\n        threshold = float(np.percentile(future_carbons, self.green_threshold_percentile))\n        \n        # Find contiguous windows below threshold\n        windows = []\n        window_start = None\n        \n        for i, t in enumerate(future_times):\n            carbon = future_carbons[i]\n            if carbon < threshold:\n                if window_start is None:\n                    window_start = t\n            else:\n                if window_start is not None:\n                    window_duration = t - window_start\n                    if window_duration >= self.window_min_duration_ms:\n                        windows.append((window_start, t, window_duration))\n                    window_start = None\n        \n        # Check if last window extends to end\n        if window_start is not None:\n            window_duration = future_times[-1] - window_start\n            if window_duration >= self.window_min_duration_ms:\n                windows.append((window_start, future_times[-1], window_duration))\n        \n        return windows\n    \n    def _compute_critical_paths(self, job_dag):\n        \"\"\"Compute critical path lengths for all nodes in a job DAG.\"\"\"\n        if job_dag in self.job_critical_paths:\n            return self.job_critical_paths[job_dag], self.job_total_remaining.get(job_dag, 0)\n        \n        # Build adjacency and compute depths\n        if not hasattr(job_dag, 'frontier_nodes') or not job_dag.frontier_nodes:\n            return {}, 0\n        \n        # Compute depths using BFS from start nodes\n        depths = {}\n        total_remaining = 0\n        \n        # Get all nodes in the DAG\n        all_nodes = set()\n        for node in job_dag.frontier_nodes:\n            all_nodes.add(node)\n            if hasattr(node, 'children'):\n                for child in node.children:\n                    all_nodes.add(child)\n            if hasattr(node, 'parents'):\n                for parent in node.parents:\n                    all_nodes.add(parent)\n        \n        # Compute depths\n        frontier = [n for n in all_nodes if not hasattr(n, 'parents') or not n.parents]\n        for node in frontier:\n            depths[node] = 0\n        \n        while frontier:\n            current = frontier.pop(0)\n            if hasattr(current, 'children'):\n                for child in current.children:\n                    new_depth = depths[current] + 1\n                    if child not in depths or new_depth > depths[child]:\n                        depths[child] = new_depth\n                        frontier.append(child)\n        \n        # Compute critical path (longest path from each node to end)\n        critical_paths = {}\n        \n        # Topological order (reverse depth)\n        sorted_nodes = sorted(all_nodes, key=lambda n: depths.get(n, 0), reverse=True)\n        \n        for node in sorted_nodes:\n            max_child_path = 0\n            if hasattr(node, 'children') and node.children:\n                for child in node.children:\n                    child_path = critical_paths.get(child, 0) + 1\n                    max_child_path = max(max_child_path, child_path)\n            critical_paths[node] = max_child_path\n            \n            # Estimate remaining work\n            if hasattr(node, 'num_tasks'):\n                remaining = node.num_tasks - (node.next_task_idx if hasattr(node, 'next_task_idx') else 0)\n                total_remaining += remaining * 15000  # approximate duration\n        \n        self.job_critical_paths[job_dag] = critical_paths\n        self.job_total_remaining[job_dag] = total_remaining\n        self.job_node_depths[job_dag] = depths\n        \n        return critical_paths, total_remaining\n    \n    def _compute_urgency(self, node, job_dag, current_time):\n        \"\"\"Compute parallelism-aware urgency for a task.\"\"\"\n        critical_paths, total_remaining = self._compute_critical_paths(job_dag)\n        \n        if not critical_paths:\n            return 0.5\n        \n        node_critical_path = critical_paths.get(node, 0)\n        if node_critical_path == 0 and total_remaining == 0:\n            return 0.5\n        \n        # Urgency = critical path remaining / total remaining work\n        if total_remaining > 0:\n            urgency_ratio = node_critical_path / (total_remaining / 15000)  # normalize by task duration\n        else:\n            urgency_ratio = 0.5\n        \n        # Clamp to [0, 1]\n        urgency = max(0.0, min(1.0, urgency_ratio))\n        \n        # Adjust for task progress\n        if hasattr(node, 'next_task_idx') and hasattr(node, 'num_tasks'):\n            progress = node.next_task_idx / max(node.num_tasks, 1)\n            urgency = urgency * (1.0 - progress * 0.5)  # Reduce urgency for partially completed tasks\n        \n        return urgency\n    \n    def _estimate_parallelism(self, node):\n        \"\"\"Estimate how many executors a task can effectively use.\"\"\"\n        if node in self.task_parallelism:\n            return self.task_parallelism[node]\n        \n        # Default: assume moderate parallelism\n        parallelism = 2\n        \n        # Adjust based on task characteristics\n        if hasattr(node, 'num_tasks'):\n            remaining = node.num_tasks - (node.next_task_idx if hasattr(node, 'next_task_idx') else 0)\n            if remaining > 10:\n                parallelism = min(4, remaining // 3)\n            elif remaining > 5:\n                parallelism = 3\n            elif remaining > 2:\n                parallelism = 2\n            else:\n                parallelism = 1\n        \n        self.task_parallelism[node] = parallelism\n        return parallelism\n    \n    def _get_time_to_next_green_window(self, current_time, green_windows):\n        \"\"\"Get time to next green window for a task.\"\"\"\n        if not green_windows:\n            return float('inf')\n        \n        for start, end, duration in green_windows:\n            if start > current_time:\n                return start - current_time\n        \n        return float('inf')\n    \n    def _should_defer_task(self, node, job_dag, current_time, current_carbon, green_windows):\n        \"\"\"Determine if a task should be deferred to a green window.\"\"\"\n        urgency = self._compute_urgency(node, job_dag, current_time)\n        \n        # High urgency tasks should never be deferred\n        if urgency > 0.7:\n            return False\n        \n        # Get carbon percentile\n        carbon_percentile = self._get_carbon_percentile(current_time)\n        \n        # Only defer during high carbon periods\n        if carbon_percentile < self.brown_threshold_percentile:\n            return False\n        \n        # Check if there's a green window coming\n        time_to_green = self._get_time_to_next_green_window(current_time, green_windows)\n        \n        # Estima
