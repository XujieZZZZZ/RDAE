# AIDE configuration for Carbon-Aware Scheduling Optimization
# This config adapts AIDE for carbon-aware algorithm improvement

llm:
  primary_model: "deepseek-chat"
  primary_model_weight: 1.0
#  secondary_model: "deepseek-reasoner"
#  secondary_model_weight: 0.0
  api_base: "https://api.deepseek.com"
  temperature: 0.7
  top_p: 0.95
  max_tokens: 8192
  timeout: 1200

paths:
  baseline_code: ./initial_program.py
  papers_jsonl: ./analysis_results.jsonl
  simulator_dir: ./simulators/prism
  aide_config: ./config_aide.yaml
  simulator_info_file: ./simulator_info.md
  user_requirement_file: ./user_requirement.md
  # summary_md: ./Summary.md
  # prompt_dir: ./prompts
  # domain_prompt_md: ./prompts/domain_context.md

task:
  steps: 30

