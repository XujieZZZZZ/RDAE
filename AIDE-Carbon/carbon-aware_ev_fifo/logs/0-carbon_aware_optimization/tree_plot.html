te task duration\n        duration = 15000  # default\n        if hasattr(node, 'num_tasks'):\n            remaining = node.num_tasks - (node.next_task_idx if hasattr(node, 'next_task_idx') else 0)\n            duration = remaining * 15000\n        \n        # Only defer if green window is within acceptable delay\n        max_acceptable_delay = duration * self.max_deferral_factor\n        \n        if time_to_green > max_acceptable_delay:\n            return False\n        \n        # Low urgency + high carbon + green window coming = defer\n        if urgency < 0.3 and carbon_percentile > 70:\n            return True\n        \n        # Medium urgency during very high carbon\n        if urgency < 0.5 and carbon_percentile > 85:\n            return True\n        \n        return False\n    \n    def _release_deferred_tasks(self, current_time):\n        \"\"\"Release tasks whose green window has arrived.\"\"\"\n        released = []\n        \n        while self.deferred_tasks:\n            green_start, urgency, node, job_dag, duration = self.deferred_tasks[0]\n            \n            if current_time >= green_start:\n                heapq.heappop(self.deferred_tasks)\n                key = (id(node), id(job_dag))\n                if key in self.deferred_task_set:\n                    self.deferred_task_set.remove(key)\n                released.append((node, job_dag, duration))\n            else:\n                break\n        \n        return released\n    \n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n        \n        # Initialize exec_map for new jobs\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n        \n        # Update exec_map for source job\n        if source_job is not None and source_job in self.exec_map:\n            self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n        \n        # Get carbon state\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        carbon_percentile = self._get_carbon_percentile(current_time)\n        green_windows = self._find_green_windows(current_time)\n        \n        # Release deferred tasks whose green window has arrived\n        released_tasks = self._release_deferred_tasks(current_time)\n        \n        # Combine frontier nodes with released tasks\n        all_candidates = list(frontier_nodes)\n        for node, job_dag, duration in released_tasks:\n            if node not in all_candidates:\n                all_candidates.append(node)\n        \n        if not all_candidates or num_source_exec <= 0:\n            return None, num_source_exec, False\n        \n        # Compute available executors\n        total_used_exec = sum(self.exec_map.values())\n        available_global = self.exec_cap - total_used_exec\n        \n        if available_global <= 0:\n            return None, num_source_exec, False\n        \n        # Phase 1: Identify tasks to defer\n        tasks_to_execute = []\n        tasks_to_defer = []\n        \n        for node in all_candidates:\n            job_dag = node.job_dag\n            \n            if self._should_defer_task(node, job_dag, current_time, current_carbon, green_windows):\n                # Check if not already deferred\n                key = (id(node), id(job_dag))\n                if key not in self.deferred_task_set:\n                    # Find next green window\n                    time_to_green = self._get_time_to_next_green_window(current_time, green_windows)\n                    if time_to_green != float('inf'):\n                        green_start = current_time + time_to_green\n                        urgency = self._compute_urgency(node, job_dag, current_time)\n                        duration = 15000\n                        if hasattr(node, 'num_tasks'):\n                            remaining = node.num_tasks - (node.next_task_idx if hasattr(node, 'next_task_idx') else 0)\n                            duration = remaining * 15000\n                        \n                        heapq.heappush(self.deferred_tasks, (green_start, -urgency, node, job_dag, duration))\n                        self.deferred_task_set.add(key)\n                        tasks_to_defer.append(node)\n                        continue\n            \n            tasks_to_execute.append(node)\n        \n        # Phase 2: Score and rank tasks to execute\n        scored_tasks = []\n        for node in tasks_to_execute:\n            job_dag = node.job_dag\n            urgency = self._compute_urgency(node, job_dag, current_time)\n            parallelism = self._estimate_parallelism(node)\n            \n            # Compute carbon-aware score\n            if carbon_percentile < self.green_threshold_percentile:\n                # Low carbon: prioritize parallelism\n                carbon_score = 1.0 + 0.5 * (1.0 - carbon_percentile / 100.0)\n            elif carbon_percentile > self.brown_threshold_percentile:\n                # High carbon: penalize heavily, prioritize urgency\n                carbon_score = 0.3 * (1.0 - urgency)\n            else:\n                # Medium carbon: moderate penalty\n                carbon_score = 0.7 * (1.0 - carbon_percentile / 100.0) + 0.3 * urgency\n            \n            # Final score: high urgency + high parallelism + good carbon score\n            score = urgency * 2.0 + parallelism * 0.5 + carbon_score\n            \n            scored_tasks.append((score, urgency, parallelism, node, job_dag))\n        \n        # Sort by score descending\n        scored_tasks.sort(key=lambda x: (-x[0], -x[1]))\n        \n        # Phase 3: Allocate executors\n        allocated_this_round = 0\n        selected_node = None\n        use_exec = 0\n        carbon_aware_flag = False\n        \n        for score, urgency, parallelism, node, job_dag in scored_tasks:\n            if allocated_this_round >= num_source_exec:\n                break\n            \n            job_used = self.exec_map.get(job_dag, 0)\n            available_for_job = min(available_global, self.exec_cap - job_used)\n            \n            if available_for_job <= 0:\n                continue\n            \n            # Determine executor allocation based on carbon regime\n            if carbon_percentile < self.green_threshold_percentile:\n                # Low carbon: maximize parallelism\n                alloc = min(parallelism, num_source_exec - allocated_this_round, available_for_job)\n                alloc = max(alloc, 1)\n            elif carbon_percentile > self.brown_threshold_percentile:\n                # High carbon: minimal executors for high urgency, defer others\n                if urgency > 0.7:\n                    alloc = min(2, num_source_exec - allocated_this_round, available_for_job)\n                    alloc = max(alloc, 1)\n                else:\n                    # Try to defer, if not possible use minimal\n                    alloc = min(1, num_source_exec - allocated_this_round, available_for_job)\n            else:\n                # Medium carbon: proportional allocation\n                alloc_factor = 1.0 - (carbon_percentile - self.green_threshold_percentile) / (self.brown_threshold_percentile - self.green_threshold_percentile)\n                alloc = max(1, min(parallelism, int(parallelism * alloc_factor)))\n                alloc = min(alloc, num_source_exec - allocated_this_round, available_for_job)\n            \n            if alloc <= 0:\n                continue\n            \n            selected_node = node\n            use_exec = alloc\n            self.exec_map[job_dag] = job_used + alloc\n            allocated_this_round += alloc\n            carbon_aware_flag = True\n            break\n        \n        # Fallback: if no task selected, pick any available\n        if selected_node is None and all_candidates:\n            for node in all_candidates:\n                if node in tasks_to_defer:\n                    continue\n                job_dag = node.job_dag\n                job_used = self.exec_map.get(job_dag, 0)\n                available_for_job = min(available_global, self.exec_cap - job_used)\n                if available_for_job > 0:\n                    alloc = min(1, num_source_exec - allocated_this_round, available_for_job)\n                    if alloc > 0:\n                        selected_node = node\n                        use_exec = alloc\n                        self.exec_map[job_dag] = job_used + alloc\n                        carbon_aware_flag = True\n                        break\n        \n        if selected_node is not None:\n            return selected_node, use_exec, carbon_aware_flag\n        \n        return None, num_source_exec, False\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport heapq\nfrom collections import defaultdict, deque\n\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n\n        self.carbon_forecast = {}\n        self.last_forecast_time = -float('inf')\n        self.forecast_horizon = 300000\n        self.forecast_interval = 50000\n\n        self.job_slack = {}\n        self.job_carbon_budget = {}\n        self.job_remaining_work = {}\n\n        self.carbon_history = []\n        self.history_window = 10\n\n        self.low_window_threshold = 280\n        self.high_window_threshold = 400\n\n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(int(current_time), 300)\n        L = self.low_window_threshold\n        U = self.high_window_threshold\n        return current_carbon, L, U\n\n    def _update_carbon_forecast(self, current_time):\n        if current_time - self.last_forecast_time < self.forecast_interval:\n            return\n\n        self.last_forecast_time = current_time\n        self.carbon_forecast.clear()\n\n        times = []\n        carbons = []\n        start_t = int(current_time)\n        end_t = int(current_time) + self.forecast_horizon + 1\n        for t in range(start_t, end_t, 10000):\n            c = self.carbon_schedule.get(t, 300)\n            times.append(t)\n            carbons.append(c)\n\n        if len(carbons) < 2:\n            return\n\n        window_size = 3\n        ma = []\n        for i in range(len(carbons)):\n            start = max(0, i - window_size + 1)\n            ma.append(np.mean(carbons[start:i+1]))\n\n        gradient = np.gradient(ma)\n\n        low_windows = []\n        in_window = False\n        window_start = 0\n        for i, (t, c, m) in enumerate(zip(times, carbons, ma)):\n            if c < self.low_window_threshold and m < self.low_window_threshold:\n                if not in_window:\n                    in_window = True\n                    window_start = t\n            else:\n                if in_window:\n                    low_windows.append((window_start, t))\n                    in_window = False\n        if in_window:\n            low_windows.append((window_start, times[-1]))\n\n        next_low_window = None\n        for start, end in low_windows:\n            if start > current_time:\n                next_low_window = (start, end)\n                break\n\n        for i, t in enumerate(times):\n            if i >= len(gradient):\n                continue\n            score = 0.0\n            if carbons[i] < self.low_window_threshold:\n                score = -2.0\n            elif carbons[i] > self.high_window_threshold:\n                score = 2.0\n            else:\n                score = (carbons[i] - 300) / 100\n\n            if next_low_window:\n                dist_to_start = max(0, next_low_window[0] - t) / 100000.0\n                if t >= next_low_window[0] and t <= next_low_window[1]:\n                    score -= 3.0\n                elif t < next_low_window[0]:\n                    score -= 1.0 / (1.0 + dist_to_start)\n\n            self.carbon_forecast[t] = {\n                'carbon': carbons[i],\n                'score': score,\n                'gradient': gradient[i],\n                'in_low_window': carbons[i] < self.low_window_threshold\n            }\n\n    def _compute_job_metrics(self, job_dag, frontier_nodes):\n        if job_dag not in self.job_remaining_work:\n            total_tasks = 0\n            for node in job_dag.nodes:\n                total_tasks += node.num_tasks\n            self.job_remaining_work[job_dag] = total_tasks\n\n        remaining = 0\n        for node in job_dag.nodes:\n            remaining += node.num_tasks - node.next_task_idx\n\n        if job_dag not in self.job_slack:\n            self.job_slack[job_dag] = {}\n            for node in job_dag.nodes:\n                est = 0\n                lst = float('inf')\n                self.job_slack[job_dag][node] = max(0, lst - est)\n\n        if job_dag not in self.job_carbon_budget:\n            avg_low_carbon = 250\n            self.job_carbon_budget[job_dag] = remaining * avg_low_carbon\n\n        critical_path_ratio = 0.0\n        for node in frontier_nodes:\n            if node.job_dag == job_dag:\n                if self.job_slack[job_dag].get(node, 1) == 0:\n                    critical_path_ratio = 1.0\n                    break\n\n        return remaining, self.job_carbon_budget[job_dag], critical_path_ratio\n\n    def _update_carbon_budget(self, job_dag, current_carbon, exec_used, duration=1):\n        if job_dag in self.job_carbon_budget:\n            carbon_cost = current_carbon * exec_used * duration\n            self.job_carbon_budget[job_dag] -= carbon_cost\n            if self.job_carbon_budget[job_dag] < 0:\n                self.job_carbon_budget[job_dag] = 0\n\n    def _calculate_job_priority(self, job_dag, current_time, current_carbon, frontier_nodes):\n        remaining, budget, critical = self._compute_job_metrics(job_dag, frontier_nodes)\n\n        budget_ratio = 0.0\n        if self.job_remaining_work[job_dag] > 0:\n            budget_ratio = budget / (self.job_remaining_work[job_dag] * 300)\n\n        time_to_low = float('inf')\n        low_window_score = 0.0\n        for t, data in self.carbon_forecast.items():\n            if t >= current_time and data['in_low_window']:\n                time_to_low = t - current_time\n                low_window_score = -data['score']\n                break\n\n        alignment = 0.0\n        if time_to_low < 100000:\n            alignment = 1.0 - (time_to_low / 100000.0)\n\n        priority = (\n            0.6 * (remaining / max(1, self.job_remaining_work[job_dag])) +\n            0.3 * critical -\n            0.4 * budget_ratio +\n            0.3 * alignment\n        )\n\n        if current_carbon > self.high_window_threshold and budget_ratio < 0.2:\n            priority -= 1.0\n\n        return priority\n\n    def _adjust_capacity(self, current_time, current_carbon):\n        self._update_carbon_forecast(current_time)\n\n        if not self.carbon_forecast:\n            self.exec_cap = self.exec_cap_MAX\n            return\n\n        now_data = None\n        for t, data in sorted(self.carbon_forecast.items()):\n            if t >= current_time:\n                now_data = data\n                break\n        if not now_data:\n            now_data = list(self.carbon_forecast.values())[-1]\n\n        base = self.exec_cap_MAX\n        multiplier = 1.0\n\n        if now_data['carbon'] > self.high_window_threshold:\n            gradient_factor = 1.0 + now_data['gradient'] / 100.0\n            multiplier *= max(0.3, 1.0 / gradient_factor)\n\n            time_to_low = float('inf')\n            for t, data in self.carbon_forecast.items():\n                if t > current_time and data['in_low_window']:\n                    time_to_low = t - current_time\n                    break\n\n            if time_to_low < 50000:\n                multiplier *= max(0.2, time_to_low / 50000.0)\n\n        elif now_data['carbon'] < self.low_window_threshold:\n            backlog_factor = 1.0\n            total_used = sum(self.exec_map.values())\n            if total_used > 0:\n                backlog_factor = min(2.0, 1.0 + (total_used / self.exec_cap_MAX))\n            multiplier *= backlog_factor\n\n            if now_data['gradient'] < -10:\n                multiplier *= 1.2\n\n        else:\n            if now_data['gradient'] < 0:\n                multiplier *= 1.1\n            elif now_data['gradient'] > 0:\n                multiplier *= 0.9\n\n        new_cap = int(base * multiplier)\n        new_cap = max(self.B, min(self.exec_cap_MAX, new_cap))\n\n        smooth_factor = 0.3\n        self.exec_cap = int(smooth_factor * new_cap + (1 - smooth_factor) * self.exec_cap)\n        self.exec_cap = max(self.B, min(self.exec_cap_MAX, self.exec_cap))\n\n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n                if job_dag in self.job_slack:\n                    del self.job_slack[job_dag]\n                if job_dag in self.job_carbon_budget:\n                    del self.job_carbon_budget[job_dag]\n                if job_dag in self.job_remaining_work:\n                    del self.job_remaining_work[job_dag]\n\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        self._adjust_capacity(current_time, current_carbon)\n\n        total_used = sum(self.exec_map.values())\n        carbon_aware_pause = False\n\n        if current_carbon >= U:\n            low_window_soon = False\n            for t, data in self.carbon_forecast.items():\n                if t > current_time and t - current_time < 30000 and data['in_low_window']:\n                    low_window_soon = True\n                    break\n            if low_window_soon and total_used > self.exec_cap * 0.7:\n                carbon_aware_pause = True\n\n        if total_used >= self.exec_cap or carbon_aware_pause:\n            if source_job is not None and source_job in self.exec_map:\n                self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n            return None, num_source_exec, True\n\n        if source_job is not None:\n            for node in frontier_nodes:\n                if node.job_dag == source_job:\n                    remaining = node.num_tasks - node.next_task_idx\n                    commit = exec_commit.node_commit.get(node, 0)\n                    moving = moving_executors.count(node)\n                    available = remaining - commit - moving\n\n                    if available <= 0:\n                        continue\n\n                    use_exec = min(available, num_source_exec, self.exec_cap - self.exec_map[source_job])\n\n                    if use_exec > 0:\n                        self.exec_map[source_job] += use_exec\n                        carbon_aware_flag = (current_carbon >= U)\n                        if carbon_aware_flag:\n                            self._update_carbon_budget(source_job, current_carbon, use_exec)\n                        return node, use_exec, carbon_aware_flag\n\n        job_priorities = []\n        for job_dag in job_dags:\n            if self.exec_map[job_dag] >= self.exec_cap:\n                continue\n\n            priority = self._calculate_job_priority(job_dag, current_time, current_carbon, frontier_nodes)\n            heapq.heappush(job_priorities, (-priority, job_dag))\n\n        while job_priorities:\n            _, job_dag = heapq.heappop(job_priorities)\n\n            selected_node = None\n            for node in frontier_nodes:\n                if node.job_dag == job_dag:\n                    selected_node = node\n                    break\n\n            if selected_node is None:\n                continue\n\n            remaining = selected_node.num_tasks - selected_node.next_task_idx\n            commit = exec_commit.node_commit.get(selected_node, 0)\n            moving = moving_executors.count(selected_node)\n            available = remaining - commit - moving\n\n            if available <= 0:\n                continue\n\n            max_for_job = self.exec_cap - self.exec_map[job_dag]\n            use_exec = min(available, num_source_exec, max_for_job)\n\n            if use_exec <= 0:\n                continue\n\n            node_slack = self.job_slack[job_dag].get(selected_node, 1)\n            if current_carbon >= U and node_slack > 0:\n                use_exec = max(1, int(use_exec * 0.3))\n\n            self.exec_map[job_dag] += use_exec\n            carbon_aware_flag = (current_carbon >= U) or (current_carbon > 350 and node_slack > 0)\n\n            if carbon_aware_flag:\n                self._update_carbon_budget(job_dag, current_carbon, use_exec)\n\n            return selected_node, use_exec, carbon_aware_flag\n\n        return None, num_source_exec, False\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport math\nfrom collections import defaultdict\nimport heapq\nfrom typing import List, Tuple, Optional\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n        \n        # Carbon-aware state\n        self.deferred_tasks = []\n        self.deferred_task_set = set()\n        self.task_parallelism = {}\n        self.job_critical_paths = {}\n        self.job_total_remaining = {}\n        self.job_node_depths = {}\n        self.carbon_history = []\n        self.max_carbon_history = 1440\n        self.green_threshold_percentile = 30\n        self.brown_threshold_percentile = 70\n        self.forecast_horizon_ms = 172800000\n        self.window_min_duration_ms = 3600000\n        self.max_deferral_factor = 2.0\n        self.last_cleanup_time = 0\n        \n        # Elasticity tracking\n        self.task_elasticity_scores = {}\n        self.elasticity_decay = 0.95\n        self.min_elasticity_threshold = 0.3\n        self.max_elasticity_threshold = 2.0\n        \n        # Batch scheduling state\n        self.pending_batches = []\n        self.batch_size_target = 5\n        self.last_batch_time = 0\n        \n        # Carbon window prediction\n        self.green_window_predictions = []\n        self.prediction_accuracy = 0.8\n        self.accuracy_update_rate = 0.1\n        \n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        \n        # Update rolling carbon history\n        self.carbon_history.append((current_time, current_carbon))\n        cutoff_time = current_time - self.forecast_horizon_ms\n        self.carbon_history = [(t, c) for t, c in self.carbon_history if t >= cutoff_time]\n        if len(self.carbon_history) > self.max_carbon_history:\n            self.carbon_history = self.carbon_history[-self.max_carbon_history:]\n        \n        # Get future forecast for bounds\n        times = sorted(self.carbon_schedule.keys())\n        future_times = [t for t in times if t > current_time and t <= current_time + self.forecast_horizon_ms]\n        \n        if len(future_times) >= 24:\n            future_carbons = [self.carbon_schedule[t] for t in future_times]\n            L = float(np.percentile(future_carbons, 10))\n            U = float(np.percentile(future_carbons, 90))\n            if L >= U:\n                L = U - 10\n        else:\n            if len(self.carbon_history) >= 10:\n                historical_carbons = [c for _, c in self.carbon_history]\n                L = float(np.percentile(historical_carbons, 10))\n                U = float(np.percentile(historical_carbons, 90))\n                if L >= U:\n                    L = U - 10\n            else:\n                L = current_carbon * 0.7\n                U = current_carbon * 1.3\n                if L >= U:\n                    L = U - 10\n        \n        return current_carbon, L, U\n    \n    def _get_carbon_percentile(self, current_time):\n        if len(self.carbon_history) < 10:\n            return 50.0\n        \n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        historical_carbons = [c for _, c in self.carbon_history]\n        recent = historical_carbons[-720:] if len(historical_carbons) > 720 else historical_carbons\n        \n        percentile = sum(1 for c in recent if c < current_carbon) / len(recent) * 100\n        return percentile\n    \n    def _compute_carbon_velocity(self, current_time):\n        \"\"\"Compute rate of change of carbon intensity.\"\"\"\n        times = sorted(self.carbon_schedule.keys())\n        recent_times = [t for t in times if t >= current_time - 3600000 and t <= current_time + 3600000]\n        \n        if len(recent_times) < 6:\n            return 0.0\n        \n        recent_carbons = [self.carbon_schedule[t] for t in recent_times]\n        if len(recent_carbons) < 2:\n            return 0.0\n        \n        # Simple linear regression slope\n        x = np.array(range(len(recent_carbons)))\n        y = np.array(recent_carbons)\n        if np.std(x) == 0:\n            return 0.0\n        slope = np.polyfit(x, y, 1)[0]\n        return slope\n    \n    def _find_green_windows(self, current_time):\n        \"\"\"Find upcoming green windows with velocity-aware detection.\"\"\"\n        times = sorted(self.carbon_schedule.keys())\n        future_times = [t for t in times if t > current_time and t <= current_time + self.forecast_horizon_ms]\n        \n        if len(future_times) < 24:\n            return []\n        \n        future_carbons = [self.carbon_schedule[t] for t in future_times]\n        \n        # Adaptive threshold based on carbon velocity\n        carbon_velocity = self._compute_carbon_velocity(current_time)\n        adaptive_threshold = float(np.percentile(future_carbons, self.green_threshold_percentile))\n        \n        # If carbon is decreasing rapidly, lower threshold to catch early green\n        if carbon_velocity < -0.1:\n            adaptive_threshold *= 0.9\n        \n        # Find contiguous windows below threshold\n        windows = []\n        window_start = None\n        \n        for i, t in enumerate(future_times):\n            carbon = future_carbons[i]\n            if carbon < adaptive_threshold:\n                if window_start is None:\n                    window_start = t\n            else:\n                if window_start is not None:\n                    window_duration = t - window_start\n                    if window_duration >= self.window_min_duration_ms:\n                        windows.append((window_start, t, window_duration))\n                    window_start = None\n        \n        if window_start is not None:\n            window_duration = future_times[-1] - window_start\n            if window_duration >= self.window_min_duration_ms:\n                windows.append((window_start, future_times[-1], window_duration))\n        \n        return windows\n    \n    def _compute_critical_paths(self, job_dag):\n        if job_dag in self.job_critical_paths:\n            return self.job_critical_paths[job_dag], self.job_total_remaining.get(job_dag, 0)\n        \n        if not hasattr(job_dag, 'frontier_nodes') or not job_dag.frontier_nodes:\n            return {}, 0\n        \n        depths = {}\n        total_remaining = 0\n        \n        all_nodes = set()\n        for node in job_dag.frontier_nodes:\n            all_nodes.add(node)\n            if hasattr(node, 'children'):\n                for child in node.children:\n                    all_nodes.add(child)\n            if hasattr(node, 'parents'):\n                for parent in node.parents:\n                    all_nodes.add(parent)\n        \n        frontier = [n for n in all_nodes if not hasattr(n, 'parents') or not n.parents]\n        for node in frontier:\n            depths[node] = 0\n        \n        while frontier:\n            current = frontier.pop(0)\n            if hasattr(current, 'children'):\n                for child in current.children:\n                    new_depth = depths[current] + 1\n                    if child not in depths or new_depth > depths[child]:\n                        depths[child] = new_depth\n                        frontier.append(child)\n        \n        critical_paths = {}\n        sorted_nodes = sorted(all_nodes, key=lambda n: depths.get(n, 0), reverse=True)\n        \n        for node in sorted_nodes:\n            max_child_path = 0\n            if hasattr(node, 'children') and node.children:\n                for child in node.children:\n                    child_path = critical_paths.get(child, 0) + 1\n                    max_child_path = max(max_child_path, child_path)\n            critical_paths[node] = max_child_path\n            \n            if hasattr(node, 'num_tasks'):\n                remaining = node.num_tasks - (node.next_task_idx if hasattr(node, 'next_task_idx') else 0)\n                total_remaining += remaining * 15000\n        \n        self.job_critical_paths[job_dag] = critical_paths\n        self.job_total_remaining[job_dag] = total_remaining\n        self.job_node_depths[job_dag] = depths\n        \n        return critical_paths, total_remaining\n    \n    def _compute_elasticity_score(self, node, job_dag, current_time, current_carbon, green_windows):\n        \"\"\"Compute carbon elasticity score: (carbon saved) / (time added)\"\"\"\n        urgency = self._compute_urgency(node, job_dag, current_time)\n        \n        # Estimate task duration\n        duration = 15000\n        if hasattr(node, 'num_tasks'):\n            remaining = node.num_tasks - (node.next_task_idx if hasattr(node, 'next_task_idx') else 0)\n            duration = remaining * 15000\n        \n        parallelism = self._estimate_parallelism(node)\n        \n        # Base carbon cost if executed now\n        base_carbon_cost = current_carbon * duration * parallelism\n        \n        # Find best green window\n        best_green_carbon = current_carbon\n        best_green_start = current_time\n        \n        for start, end, win_duration in green_windows:\n            if start > current_time:\n                # Average carbon in this window\n                window_carbons = []\n                for t in sorted(self.carbon_schedule.keys()):\n                    if start <= t <= end:\n                        window_carbons.append(self.carbon_schedule[t])\n                if window_carbons:\n                    avg_carbon = np.mean(window_carbons)\n                    if avg_carbon < best_green_carbon:\n                        best_green_carbon = avg_carbon\n                        best_green_start = start\n        \n        # Deferred carbon cost\n        deferred_carbon_cost = best_green_carbon * duration * parallelism\n        \n        # Time penalty\n        time_penalty = max(1, best_green_start - current_time)\n        \n        # Carbon savings\n        carbon_savings = base_carbon_cost - deferred_carbon_cost\n        \n        # Elasticity score = carbon savings per unit time\n        elasticity = carbon_savings / time_penalty\n        \n        # Normalize by urgency (high urgency = low elasticity)\n        urgency_factor = 1.0 - urgency\n        elasticity *= urgency_factor\n        \n        return elasticity, best_green_start, duration\n    \n    def _compute_urgency(self, node, job_dag, current_time):\n        critical_paths, total_remaining = self._compute_critical_paths(job_dag)\n        \n        if not critical_paths:\n            return 0.5\n        \n        node_critical_path = critical_paths.get(node, 0)\n        if node_critical_path == 0 and total_remaining == 0:\n            return 0.5\n        \n        if total_remaining > 0:\n            urgency_ratio = node_critical_path / (total_remaining / 15000)\n        else:\n            urgency_ratio = 0.5\n        \n        urgency = max(0.0, min(1.0, urgency_ratio))\n        \n        if hasattr(node, 'next_task_idx') and hasattr(node, 'num_tasks'):\n            progress = node.next_task_idx / max(node.num_tasks, 1)\n            urgency = urgency * (1.0 - progress * 0.5)\n        \n        return urgency\n    \n    def _estimate_parallelism(self, node):\n        if node in self.task_parallelism:\n            return self.task_parallelism[node]\n        \n        parallelism = 2\n        \n        if hasattr(node, 'num_tasks'):\n            remaining = node.num_tasks - (node.next_task_idx if hasattr(node, 'next_task_idx') else 0)\n            if remaining > 10:\n                parallelism = min(4, remaining // 3)\n            elif remaining > 5:\n                parallelism = 3\n            elif remaining > 2:\n                parallelism = 2\n            else:\n                parallelism = 1\n        \n        self.task_parallelism[node] = parallelism\n        return parallelism\n    \n    def _compute_executor_allocation(self, carbon_percentile, urgency, parallelism, available_exec):\n        \"\"\"Compute executor allocation as a smooth function of carbon intensity.\"\"\"\n        if carbon_percentile < self.green_threshold_percentile:\n            # Green regime: full parallelism\n            alloc = min(parallelism, available_exec)\n        elif carbon_percentile > self.brown_threshold_percentile:\n            # Brown regime: minimal allocation, urgency-dependent\n            if urgency > 0.7:\n                alloc = min(2, available_exec)\n            else:\n                alloc = min(1, available_exec)\n        else:\n            # Yellow regime: smooth sigmoid allocation\n            normalized_carbon = (carbon_percentile - self.green_threshold_percentile) / (self.brown_threshold_percentile - self.green_threshold_percentile)\n            # Sigmoid-like allocation\n            alloc_factor = 1.0 / (1.0 + math.exp(4 * normalized_carbon - 2))\n            alloc = max(1, min(parallelism, int(parallelism * alloc_factor)))\n            alloc = min(alloc, available_exec)\n        \n        return max(1, min(alloc, available_exec))\n    \n    def _release_deferred_tasks(self, current_time):\n        \"\"\"Release tasks whose green window has arrived.\"\"\"\n        released = []\n        \n        while self.deferred_tasks:\n            green_start, urgency, node, job_dag, duration = self.deferred_tasks[0]\n            \n            if current_time >= green_start:\n                heapq.heappop(self.deferred_tasks)\n                key = (id(node), id(job_dag))\n                if key in self.deferred_task_set:\n                    self.deferred_task_set.remove(key)\n                released.append((node, job_dag, duration))\n            else:\n                break\n        \n        return released\n    \n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n        \n        # Initialize exec_map for new jobs\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n        \n        # Update exec_map for source job\n        if source_job is not None and source_job in self.exec_map:\n            self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n        \n        # Get carbon state\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        carbon_percentile = self._get_carbon_percentile(current_time)\n        carbon_velocity = self._compute_carbon_velocity(current_time)\n        green_windows = self._find_green_windows(current_time)\n        \n        # Release deferred tasks whose green window has arrived\n        released_tasks = self._release_deferred_tasks(current_time)\n        \n        # Combine frontier nodes with released tasks\n        all_candidates = list(frontier_nodes)\n        for node, job_dag, duration in released_tasks:\n            if node not in all_candidates:\n                all_candidates.append(node)\n        \n        if not all_candidates or num_source_exec <= 0:\n            return None, num_source_exec, False\n        \n        # Compute available executors\n        total_used_exec = sum(self.exec_map.values())\n        available_global = self.exec_cap - total_used_exec\n        \n        if available_global <= 0:\n            return None, num_source_exec, False\n        \n        # Phase 1: Compute elasticity scores and form batches\n        tasks_with_elasticity = []\n        tasks_to_defer = []\n        \n        for node in all_candidates:\n            job_dag = node.job_dag\n            elasticity, best_green_start, duration = self._compute_elasticity_score(node, job_dag, current_time, current_carbon, green_windows)\n            \n            # Cache elasticity score\n            self.task_elasticity_scores[(id(node), id(job_dag))] = elasticity\n            \n            if elasticity > self.min_elasticity_threshold and carbon_percentile > self.brown_threshold_percentile:\n                # High elasticity + high carbon = defer\n                key = (id(node), id(job_dag))\n                if key not in self.deferred_task_set:\n                    urgency = self._compute_urgency(node, job_dag, current_time)\n                    heapq.heappush(self.deferred_tasks, (best_green_start, -urgency, node, job_dag, duration))\n                    self.deferred_task_set.add(key)\n                    tasks_to_defer.append(node)\n                    continue\n            \n            tasks_with_elasticity.append((elasticity, node, job_dag, duration))\n        \n        # Phase 2: Score remaining tasks with carbon-weighted utility\n        scored_tasks = []\n        for elasticity, node, job_dag, duration in tasks_with_elasticity:\n            urgency = self._compute_urgency(node, job_dag, current_time)\n            parallelism = self._estimate_parallelism(node)\n            \n            # Carbon-time utility function\n            carbon_factor = 1.0 - (carbon_percentile / 100.0)\n            utility = urgency * 2.0 + parallelism * 0.5 + carbon_factor * 0.5 - elasticity * 0.3\n            \n            # Adjust for carbon velocity (if carbon is dropping, wait)\n            if carbon_velocity < -0.1 and carbon_percentile > 50:\n                utility *= 0.8\n            \n            scored_tasks.append((utility, urgency, parallelism, node, job_dag, duration))\n        \n        # Sort by utility descending\n        scored_tasks.sort(key=lambda x: (-x[0], -x[1]))\n        \n        # Phase 3: Allocate executors with smooth carbon-aware allocation\n        allocated_this_round = 0\n        selected_node = None\n        use_exec = 0\n        carbon_aware_flag = False\n        \n        for utility, urgency, parallelism, node, job_dag, duration in scored_tasks:\n            if allocated_this_round >= num_source_exec:\n                break\n            \n            job_used = self.exec_map.get(job_dag, 0)\n            available_for_job = min(available_global, self.exec_cap - job_used)\n            \n            if available_for_job <= 0:\n                continue\n            \n            # Compute executor allocation using smooth function\n            alloc = self._compute_executor_allocation(carbon_percentile, urgency, parallelism, min(num_source_exec - allocated_this_round, available_for_job))\n            \n            if alloc <= 0:\n                continue\n            \n            selected_node = node\n            use_exec = alloc\n            self.exec_map[job_dag] = job_used + alloc\n            allocated_this_round += alloc\n            carbon_aware_flag = True\n            break\n        \n        # Fallback: if no task selected, pick any available with minimal allocation\n        if selected_node is None and all_candidates:\n            for node in all_candidates:\n                if node in tasks_to_defer:\n                    continue\n                job_dag = node.job_dag\n                job_used = self.exec_map.get(job_dag, 0)\n                available_for_job = min(available_global, self.exec_cap - job_used)\n                if available_for_job > 0:\n                    alloc = min(1, num_source_exec - allocated_this_round, available_for_job)\n                    if alloc > 0:\n                        selected_node = node\n                        use_exec = alloc\n                        self.exec_map[job_dag] = job_used + alloc\n                        carbon_aware_flag = True\n                        break\n        \n        if selected_node is not None:\n            return selected_node, use_exec, carbon_aware_flag\n        \n        return None, num_source_exec, False\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport heapq\nfrom collections import defaultdict, deque\n\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n\n        self.carbon_forecast = {}\n        self.last_forecast_time = -float('inf')\n        self.forecast_horizon = 300000\n        self.forecast_interval = 50000\n\n        self.job_slack = {}\n        self.job_carbon_budget = {}\n        self.job_remaining_work = {}\n\n        self.carbon_history = []\n        self.history_window = 10\n\n        self.low_window_threshold = 280\n        self.high_window_threshold = 400\n        \n        self._counter = 0\n\n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(int(current_time), 300)\n        L = self.low_window_threshold\n        U = self.high_window_threshold\n        return current_carbon, L, U\n\n    def _update_carbon_forecast(self, current_time):\n        if current_time - self.last_forecast_time < self.forecast_interval:\n            return\n\n        self.last_forecast_time = current_time\n        self.carbon_forecast.clear()\n\n        times = []\n        carbons = []\n        start_t = int(current_time)\n        end_t = int(current_time) + self.forecast_horizon + 1\n        for t in range(start_t, end_t, 10000):\n            c = self.carbon_schedule.get(t, 300)\n            times.append(t)\n            carbons.append(c)\n\n        if len(carbons) < 2:\n            return\n\n        window_size = 3\n        ma = []\n        for i in range(len(carbons)):\n            start = max(0, i - window_size + 1)\n            ma.append(np.mean(carbons[start:i+1]))\n\n        gradient = np.gradient(ma)\n\n        low_windows = []\n        in_window = False\n        window_start = 0\n        for i, (t, c, m) in enumerate(zip(times, carbons, ma)):\n            if c < self.low_window_threshold and m < self.low_window_threshold:\n                if not in_window:\n                    in_window = True\n                    window_start = t\n            else:\n                if in_window:\n                    low_windows.append((window_start, t))\n                    in_window = False\n        if in_window:\n            low_windows.append((window_start, times[-1]))\n\n        next_low_window = None\n        for start, end in low_windows:\n            if start > current_time:\n                next_low_window = (start, end)\n                break\n\n        for i, t in enumerate(times):\n            if i >= len(gradient):\n                continue\n            score = 0.0\n            if carbons[i] < self.low_window_threshold:\n                score = -2.0\n            elif carbons[i] > self.high_window_threshold:\n                score = 2.0\n            else:\n                score = (carbons[i] - 300) / 100\n\n            if next_low_window:\n                dist_to_start = max(0, next_low_window[0] - t) / 100000.0\n                if t >= next_low_window[0] and t <= next_low_window[1]:\n                    score -= 3.0\n                elif t < next_low_window[0]:\n                    score -= 1.0 / (1.0 + dist_to_start)\n\n            self.carbon_forecast[t] = {\n                'carbon': carbons[i],\n                'score': score,\n                'gradient': gradient[i],\n                'in_low_window': carbons[i] < self.low_window_threshold\n            }\n\n    def _compute_job_metrics(self, job_dag, frontier_nodes):\n        if job_dag not in self.job_remaining_work:\n            total_tasks = 0\n            for node in job_dag.nodes:\n                total_tasks += node.num_tasks\n            self.job_remaining_work[job_dag] = total_tasks\n\n        remaining = 0\n        for node in job_dag.nodes:\n            remaining += node.num_tasks - node.next_task_idx\n\n        if job_dag not in self.job_slack:\n            self.job_slack[job_dag] = {}\n            for node in job_dag.nodes:\n                est = 0\n                lst = float('inf')\n                self.job_slack[job_dag][node] = max(0, lst - est)\n\n        if job_dag not in self.job_carbon_budget:\n            avg_low_carbon = 250\n            self.job_carbon_budget[job_dag] = remaining * avg_low_carbon\n\n        critical_path_ratio = 0.0\n        for node in frontier_nodes:\n            if node.job_dag == job_dag:\n                if self.job_slack[job_dag].get(node, 1) == 0:\n                    critical_path_ratio = 1.0\n                    break\n\n        return remaining, self.job_carbon_budget[job_dag], critical_path_ratio\n\n    def _update_carbon_budget(self, job_dag, current_carbon, exec_used, duration=1):\n        if job_dag in self.job_carbon_budget:\n            carbon_cost = current_carbon * exec_used * duration\n            self.job_carbon_budget[job_dag] -= carbon_cost\n            if self.job_carbon_budget[job_dag] < 0:\n                self.job_carbon_budget[job_dag] = 0\n\n    def _calculate_job_priority(self, job_dag, current_time, current_carbon, frontier_nodes):\n        remaining, budget, critical = self._compute_job_metrics(job_dag, frontier_nodes)\n\n        budget_ratio = 0.0\n        if self.job_remaining_work[job_dag] > 0:\n            budget_ratio = budget / (self.job_remaining_work[job_dag] * 300)\n\n        time_to_low = float('inf')\n        low_window_score = 0.0\n        for t, data in self.carbon_forecast.items():\n            if t >= current_time and data['in_low_window']:\n                time_to_low = t - current_time\n                low_window_score = -data['score']\n                break\n\n        alignment = 0.0\n        if time_to_low < 100000:\n            alignment = 1.0 - (time_to_low / 100000.0)\n\n        priority = (\n            0.6 * (remaining / max(1, self.job_remaining_work[job_dag])) +\n            0.3 * critical -\n            0.4 * budget_ratio +\n            0.3 * alignment\n        )\n\n        if current_carbon > self.high_window_threshold and budget_ratio < 0.2:\n            priority -= 1.0\n\n        return priority\n\n    def _adjust_capacity(self, current_time, current_carbon):\n        self._update_carbon_forecast(current_time)\n\n        if not self.carbon_forecast:\n            self.exec_cap = self.exec_cap_MAX\n            return\n\n        now_data = None\n        for t, data in sorted(self.carbon_forecast.items()):\n            if t >= current_time:\n                now_data = data\n                break\n        if not now_data:\n            now_data = list(self.carbon_forecast.values())[-1]\n\n        base = self.exec_cap_MAX\n        multiplier = 1.0\n\n        if now_data['carbon'] > self.high_window_threshold:\n            gradient_factor = 1.0 + now_data['gradient'] / 100.0\n            multiplier *= max(0.3, 1.0 / gradient_factor)\n\n            time_to_low = float('inf')\n            for t, data in self.carbon_forecast.items():\n                if t > current_time and data['in_low_window']:\n                    time_to_low = t - current_time\n                    break\n\n            if time_to_low < 50000:\n                multiplier *= max(0.2, time_to_low / 50000.0)\n\n        elif now_data['carbon'] < self.low_window_threshold:\n            backlog_factor = 1.0\n            total_used = sum(self.exec_map.values())\n            if total_used > 0:\n                backlog_factor = min(2.0, 1.0 + (total_used / self.exec_cap_MAX))\n            multiplier *= backlog_factor\n\n            if now_data['gradient'] < -10:\n                multiplier *= 1.2\n\n        else:\n            if now_data['gradient'] < 0:\n                multiplier *= 1.1\n            elif now_data['gradient'] > 0:\n                multiplier *= 0.9\n\n        new_cap = int(base * multiplier)\n        new_cap = max(self.B, min(self.exec_cap_MAX, new_cap))\n\n        smooth_factor = 0.3\n        self.exec_cap = int(smooth_factor * new_cap + (1 - smooth_factor) * self.exec_cap)\n        self.exec_cap = max(self.B, min(self.exec_cap_MAX, self.exec_cap))\n\n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n                if job_dag in self.job_slack:\n                    del self.job_slack[job_dag]\n                if job_dag in self.job_carbon_budget:\n                    del self.job_carbon_budget[job_dag]\n                if job_dag in self.job_remaining_work:\n                    del self.job_remaining_work[job_dag]\n\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        self._adjust_capacity(current_time, current_carbon)\n\n        total_used = sum(self.exec_map.values())\n        carbon_aware_pause = False\n\n        if current_carbon >= U:\n            low_window_soon = False\n            for t, data in self.carbon_forecast.items():\n                if t > current_time and t - current_time < 30000 and data['in_low_window']:\n                    low_window_soon = True\n                    break\n            if low_window_soon and total_used > self.exec_cap * 0.7:\n                carbon_aware_pause = True\n\n        if total_used >= self.exec_cap or carbon_aware_pause:\n            if source_job is not None and source_job in self.exec_map:\n                self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n            return None, num_source_exec, True\n\n        if source_job is not None:\n            for node in frontier_nodes:\n                if node.job_dag == source_job:\n                    remaining = node.num_tasks - node.next_task_idx\n                    commit = exec_commit.node_commit.get(node, 0)\n                    moving = moving_executors.count(node)\n                    available = remaining - commit - moving\n\n                    if available <= 0:\n                        continue\n\n                    use_exec = min(available, num_source_exec, self.exec_cap - self.exec_map[source_job])\n\n                    if use_exec > 0:\n                        self.exec_map[source_job] += use_exec\n                        carbon_aware_flag = (current_carbon >= U)\n                        if carbon_aware_flag:\n                            self._update_carbon_budget(source_job, current_carbon, use_exec)\n                        return node, use_exec, carbon_aware_flag\n\n        job_priorities = []\n        for job_dag in job_dags:\n            if self.exec_map[job_dag] >= self.exec_cap:\n                continue\n\n            priority = self._calculate_job_priority(job_dag, current_time, current_carbon, frontier_nodes)\n            heapq.heappush(job_priorities, (-priority, self._counter, job_dag))\n            self._counter += 1\n\n        while job_priorities:\n            _, _, job_dag = heapq.heappop(job_priorities)\n\n            selected_node = None\n            for node in frontier_nodes:\n                if node.job_dag == job_dag:\n                    selected_node = node\n                    break\n\n            if selected_node is None:\n                continue\n\n            remaining = selected_node.num_tasks - selected_node.next_task_idx\n            commit = exec_commit.node_commit.get(selected_node, 0)\n            moving = moving_executors.count(selected_node)\n            available = remaining - commit - moving\n\n            if available <= 0:\n                continue\n\n            max_for_job = self.exec_cap - self.exec_map[job_dag]\n            use_exec = min(available, num_source_exec, max_for_job)\n\n            if use_exec <= 0:\n                continue\n\n            node_slack = self.job_slack[job_dag].get(selected_node, 1)\n            if current_carbon >= U and node_slack > 0:\n                use_exec = max(1, int(use_exec * 0.3))\n\n            self.exec_map[job_dag] += use_exec\n            carbon_aware_flag = (current_carbon >= U) or (current_carbon > 350 and node_slack > 0)\n\n            if carbon_aware_flag:\n                self._update_carbon_budget(job_dag, current_carbon, use_exec)\n\n            return selected_node, use_exec, carbon_aware_flag\n\n        return None, num_source_exec, False\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport math\nfrom collections import defaultdict\nimport heapq\nfrom typing import List, Tuple, Optional\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n        \n        # Carbon budget tracking\n        self.job_carbon_budgets = {}  # job_dag -> remaining carbon budget\n        self.job_carbon_debt = {}     # job_dag -> accumulated carbon debt\n        self.job_remaining_tasks = {} # job_dag -> number of remaining frontier tasks\n        self.job_last_allocation = {} # job_dag -> last executor allocation count\n        \n        # Rolling carbon statistics\n        self.carbon_history = []      # list of (timestamp, carbon_intensity)\n        self.max_history_size = 1440  # 24 hours at 1-minute resolution\n        self.rolling_avg_window = 720 # 12 hours\n        \n        # Starvation prevention\n        self.job_wait_times = {}      # job_dag -> time since last executor allocation\n        self.starvation_threshold_ms = 300000  # 5 minutes\n        \n        # Budget parameters\n        self.budget_scale_factor = 1.5\n        self.budget_min_ratio = 0.2\n        self.budget_max_ratio = 1.5\n        self.debt_repay_rate = 0.8\n        \n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        \n        # Update rolling carbon history\n        self.carbon_history.append((current_time, current_carbon))\n        cutoff_time = current_time - self.max_history_size * 60000  # approximate minute\n        self.carbon_history = [(t, c) for t, c in self.carbon_history if t >= cutoff_time]\n        if len(self.carbon_history) > self.max_history_size:\n            self.carbon_history = self.carbon_history[-self.max_history_size:]\n        \n        # Compute rolling average carbon\n        if len(self.carbon_history) >= 60:\n            recent_history = self.carbon_history[-self.rolling_avg_window:] if len(self.carbon_history) > self.rolling_avg_window else self.carbon_history\n            rolling_avg = np.mean([c for _, c in recent_history])\n        else:\n            rolling_avg = current_carbon\n        \n        # Compute bounds based on recent variability\n        if len(self.carbon_history) >= 60:\n            recent_carbons = [c for _, c in self.carbon_history[-60:]]\n            std = np.std(recent_carbons)\n            L = max(0, rolling_avg - 2 * std)\n            U = rolling_avg + 2 * std\n            if L >= U:\n                L = U - 10\n        else:\n            L = current_carbon * 0.7\n            U = current_carbon * 1.3\n            if L >= U:\n                L = U - 10\n        \n        return current_carbon, L, U\n    \n    def _compute_carbon_ratio(self, current_time):\n        \"\"\"Compute ratio of current carbon to rolling average.\"\"\"\n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        \n        if len(self.carbon_history) >= 60:\n            recent_history = self.carbon_history[-self.rolling_avg_window:] if len(self.carbon_history) > self.rolling_avg_window else self.carbon_history\n            rolling_avg = np.mean([c for _, c in recent_history])\n            if rolling_avg > 0:\n                return current_carbon / rolling_avg\n        return 1.0\n    \n    def _compute_job_remaining_work(self, job_dag):\n        \"\"\"Estimate remaining work for a job based on frontier nodes.\"\"\"\n        if not hasattr(job_dag, 'frontier_nodes') or not job_dag.frontier_nodes:\n            return 0\n        \n        total_tasks = 0\n        for node in job_dag.frontier_nodes:\n            if hasattr(node, 'num_tasks') and hasattr(node, 'next_task_idx'):\n                remaining = node.num_tasks - node.next_task_idx\n                total_tasks += remaining\n            else:\n                total_tasks += 1\n        \n        return total_tasks\n    \n    def _update_carbon_budgets(self, current_time, job_dags):\n        \"\"\"Update carbon budgets for all active jobs based on current conditions.\"\"\"\n        carbon_ratio = self._compute_carbon_ratio(current_time)\n        \n        # Determine budget adjustment factor\n        if carbon_ratio > 1.2:\n            budget_factor = self.budget_min_ratio\n        elif carbon_ratio < 0.8:\n            budget_factor = self.budget_max_ratio\n        else:\n            # Linear interpolation between 0.2 and 1.5\n            budget_factor = self.budget_min_ratio + (self.budget_max_ratio - self.budget_min_ratio) * (1.2 - carbon_ratio) / (1.2 - 0.8)\n            budget_factor = max(self.budget_min_ratio, min(self.budget_max_ratio, budget_factor))\n        \n        # Update budgets for each job\n        for job_dag in job_dags:\n            remaining_tasks = self._compute_job_remaining_work(job_dag)\n            self.job_remaining_tasks[job_dag] = remaining_tasks\n            \n            if remaining_tasks > 0:\n                # Base budget proportional to remaining work\n                base_budget = remaining_tasks * 2  # Assume 2 executors per task as baseline\n                \n                # Apply carbon ratio adjustment\n                adjusted_budget = base_budget * budget_factor\n                \n                # Apply debt reduction\n                debt = self.job_carbon_debt.get(job_dag, 0)\n                if debt > 0:\n                    adjusted_budget = max(adjusted_budget * self.debt_repay_rate, adjusted_budget - debt)\n                \n                # Ensure minimum budget\n                adjusted_budget = max(1, adjusted_budget)\n                \n                self.job_carbon_budgets[job_dag] = adjusted_budget\n            else:\n                self.job_carbon_budgets[job_dag] = 0\n    \n    def _allocate_executors_from_budget(self, job_dag, available_exec, current_time):\n        \"\"\"Allocate executors to a job based on its carbon budget.\"\"\"\n        budget = self.job_carbon_budgets.get(job_dag, 0)\n        remaining_tasks = self.job_remaining_tasks.get(job_dag, 0)\n        \n        if remaining_tasks <= 0 or budget <= 0:\n            return 0\n        \n        # Compute executor allocation proportional to budget per remaining task\n        alloc = min(available_exec, max(1, int(budget / remaining_tasks)))\n        \n        # Cap allocation to prevent over-allocation\n        alloc = min(alloc, remaining_tasks * 2)\n        \n        return alloc\n    \n    def _check_starvation(self, job_dag, current_time):\n        \"\"\"Check if a job is starving for executors.\"\"\"\n        last_alloc_time = self.job_wait_times.get(job_dag, current_time)\n        wait_time = current_time - last_alloc_time\n        \n        if wait_time >= self.starvation_threshold_ms:\n            return True\n        return False\n    \n    def _update_debt(self, job_dag, allocated_exec, current_time):\n        \"\"\"Update carbon debt based on executor usage.\"\"\"\n        carbon_ratio = self._compute_carbon_ratio(current_time)\n        \n        # If carbon ratio is high, allocate more debt for each executor used\n        debt_increase = allocated_exec * max(0, carbon_ratio - 1.0) * 10\n        \n        current_debt = self.job_carbon_debt.get(job_dag, 0)\n        if debt_increase > 0:\n            self.job_carbon_debt[job_dag] = current_debt + debt_increase\n        else:\n            # Repay debt during low carbon periods\n            repayment = abs(debt_increase) * 0.5\n            self.job_carbon_debt[job_dag] = max(0, current_debt - repayment)\n    \n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n        \n        # Initialize exec_map for new jobs\n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n                self.job_carbon_budgets[job_dag] = 0\n                self.job_carbon_debt[job_dag] = 0\n                self.job_remaining_tasks[job_dag] = 0\n                self.job_last_allocation[job_dag] = 0\n                self.job_wait_times[job_dag] = current_time\n        \n        # Remove stale jobs\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n                del self.job_carbon_budgets[job_dag]\n                del self.job_carbon_debt[job_dag]\n                del self.job_remaining_tasks[job_dag]\n                del self.job_last_allocation[job_dag]\n                del self.job_wait_times[job_dag]\n        \n        # Update exec_map for source job\n        if source_job is not None and source_job in self.exec_map:\n            self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n        \n        # Get carbon state\n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        \n        # Update carbon budgets for all active jobs\n        self._update_carbon_budgets(current_time, job_dags)\n        \n        # Update wait times for jobs that haven't received executors\n        for job_dag in job_dags:\n            if self.exec_map.get(job_dag, 0) == 0:\n                if job_dag not in self.job_wait_times:\n                    self.job_wait_times[job_dag] = current_time\n            else:\n                self.job_wait_times[job_dag] = current_time\n        \n        # Collect all candidate nodes from frontier\n        all_candidates = list(frontier_nodes)\n        \n        if not all_candidates or num_source_exec <= 0:\n            return None, num_source_exec, False\n        \n        # Compute available executors globally\n        total_used_exec = sum(self.exec_map.values())\n        available_global = self.exec_cap - total_used_exec\n        \n        if available_global <= 0:\n            return None, num_source_exec, False\n        \n        # Build candidate list with job information\n        candidates_with_jobs = []\n        for node in all_candidates:\n            job_dag = node.job_dag\n            candidates_with_jobs.append((node, job_dag))\n        \n        # Phase 1: Check for starving jobs first\n        starving_jobs = []\n        for node, job_dag in candidates_with_jobs:\n            if self._check_starvation(job_dag, current_time):\n                starving_jobs.append((node, job_dag))\n        \n        if starving_jobs:\n            # Allocate 1 executor to a starving job\n            node, job_dag = starving_jobs[0]\n            job_used = self.exec_map.get(job_dag, 0)\n            available_for_job = min(available_global, self.exec_cap - job_used)\n            \n            if available_for_job > 0:\n                alloc = min(1, num_source_exec, available_for_job)\n                if alloc > 0:\n                    self.exec_map[job_dag] = job_used + alloc\n                    self.job_wait_times[job_dag] = current_time\n                    self._update_debt(job_dag, alloc, current_time)\n                    return node, alloc, True\n        \n        # Phase 2: Sort candidates by remaining work (most work first) for fairness\n        candidates_with_work = []\n        for node, job_dag in candidates_with_jobs:\n            remaining_tasks = self.job_remaining_tasks.get(job_dag, 0)\n            if remaining_tasks > 0:\n                candidates_with_work.append((remaining_tasks, node, job_dag))\n        \n        # Sort by remaining work descending to prioritize jobs with more to do\n        candidates_with_work.sort(key=lambda x: (-x[0]))\n        \n        # Phase 3: Allocate executors based on carbon budgets\n        allocated_this_round = 0\n        selected_node = None\n        use_exec = 0\n        carbon_aware_flag = False\n        \n        for remaining_tasks, node, job_dag in candidates_with_work:\n            if allocated_this_round >= num_source_exec:\n                break\n            \n            job_used = self.exec_map.get(job_dag, 0)\n            available_for_job = min(available_global, self.exec_cap - job_used)\n            \n            if available_for_job <= 0:\n                continue\n            \n            # Allocate executors from budget\n            alloc = self._allocate_executors_from_budget(job_dag, min(num_source_exec - allocated_this_round, available_for_job), current_time)\n            \n            if alloc <= 0:\n                continue\n            \n            selected_node = node\n            use_exec = alloc\n            self.exec_map[job_dag] = job_used + alloc\n            allocated_this_round += alloc\n            carbon_aware_flag = True\n            self.job_wait_times[job_dag] = current_time\n            self._update_debt(job_dag, alloc, current_time)\n            break\n        \n        # Fallback: if no task selected, pick any available with minimal allocation\n        if selected_node is None and all_candidates:\n            for node in all_candidates:\n                job_dag = node.job_dag\n                job_used = self.exec_map.get(job_dag, 0)\n                available_for_job = min(available_global, self.exec_cap - job_used)\n                if available_for_job > 0:\n                    alloc = min(1, num_source_exec - allocated_this_round, available_for_job)\n                    if alloc > 0:\n                        selected_node = node\n                        use_exec = alloc\n                        self.exec_map[job_dag] = job_used + alloc\n                        carbon_aware_flag = True\n                        self.job_wait_times[job_dag] = current_time\n                        self._update_debt(job_dag, alloc, current_time)\n                        break\n        \n        if selected_node is not None:\n            return selected_node, use_exec, carbon_aware_flag\n        \n        return None, num_source_exec, False\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nfrom collections import defaultdict, deque\nimport heapq\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n        \n        self.idle_mode = False\n        self.idle_duration_remaining = 0\n        self.task_duration_cache = {}\n        self.last_idle_time = -float('inf')\n        self.idle_cooldown = 20000\n        self.low_carbon_threshold_ratio = 0.3\n        self.high_carbon_threshold_ratio = 0.7\n        self.short_task_threshold = 5\n        self._counter = 0\n\n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(int(current_time), 300)\n        L = 200\n        U = 500\n        return current_carbon, L, U\n\n    def _estimate_task_duration(self, node):\n        node_id = id(node)\n        if node_id not in self.task_duration_cache:\n            duration = max(1, node.num_tasks // 10)\n            self.task_duration_cache[node_id] = duration\n        return self.task_duration_cache[node_id]\n\n    def _get_next_low_carbon_time(self, current_time, L, U):\n        current_carbon = self.carbon_schedule.get(int(current_time), 300)\n        if current_carbon < L + 0.3 * (U - L):\n            return current_time\n        look_ahead = 100000\n        step = 10000\n        for t in range(int(current_time) + step, int(current_time) + look_ahead + step, step):\n            c = self.carbon_schedule.get(t, 300)\n            if c < L + 0.3 * (U - L):\n                return t\n        return int(current_time) + look_ahead\n\n    def get_action(self, obs):\n        job_dags, source_job, num_source_exec, frontier_nodes, executor_limits, exec_commit, moving_executors, action_map, current_time = obs\n        \n        for job_dag in job_dags:\n            if job_dag not in self.exec_map:\n                self.exec_map[job_dag] = 0\n        for job_dag in list(self.exec_map):\n            if job_dag not in job_dags:\n                del self.exec_map[job_dag]\n        \n        current_carbon, L, U = self.get_carbon_intensity(current_time)\n        \n        if current_carbon > U:\n            normalized_carbon = min(1.0, (current_carbon - L) / (U - L))\n        else:\n            normalized_carbon = max(0.0, (current_carbon - L) / (U - L))\n        \n        if self.idle_mode:\n            self.idle_duration_remaining -= 1\n            if self.idle_duration_remaining <= 0:\n                self.idle_mode = False\n                self.last_idle_time = current_time\n            else:\n                if source_job is not None and source_job in self.exec_map:\n                    self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n                return None, num_source_exec, True\n        \n        total_used = sum(self.exec_map.values())\n        \n        if current_time - self.last_idle_time > self.idle_cooldown:\n            if normalized_carbon > self.high_carbon_threshold_ratio:\n                backlog_ratio = len(frontier_nodes) / max(1, len(job_dags) * 5)\n                if backlog_ratio < 0.5:\n                    next_low = self._get_next_low_carbon_time(current_time, L, U)\n                    time_to_low = max(0, next_low - current_time)\n                    idle_duration = int(min(\n                        (normalized_carbon - self.high_carbon_threshold_ratio) * 100,\n                        time_to_low / 10000,\n                        30\n                    ))\n                    if idle_duration > 3:\n                        self.idle_mode = True\n                        self.idle_duration_remaining = idle_duration\n                        if source_job is not None and source_job in self.exec_map:\n                            self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n                        return None, num_source_exec, True\n        \n        if normalized_carbon < self.low_carbon_threshold_ratio:\n            capacity = self.exec_cap_MAX\n        elif normalized_carbon > self.high_carbon_threshold_ratio:\n            capacity = max(self.B, int(self.exec_cap_MAX * (1 - normalized_carbon)))\n        else:\n            capacity = int(self.exec_cap_MAX * (1 - normalized_carbon * 0.5))\n        \n        capacity = max(self.B, min(self.exec_cap_MAX, capacity))\n        self.exec_cap = capacity\n        \n        if total_used >= self.exec_cap:\n            if source_job is not None and source_job in self.exec_map:\n                self.exec_map[source_job] = max(self.exec_map[source_job] - num_source_exec, 0)\n            return None, num_source_exec, True\n        \n        if source_job is not None:\n            for node in frontier_nodes:\n                if node.job_dag == source_job:\n                    remaining = node.num_tasks - node.next_task_idx\n                    commit = exec_commit.node_commit.get(node, 0)\n                    moving = moving_executors.count(node)\n                    available = remaining - commit - moving\n                    if available <= 0:\n                        continue\n                    use_exec = min(available, num_source_exec, self.exec_cap - self.exec_map[source_job])\n                    if use_exec > 0:\n                        self.exec_map[source_job] += use_exec\n                        duration = self._estimate_task_duration(node)\n                        carbon_aware_flag = (duration > self.short_task_threshold and normalized_carbon > 0.3)\n                        return node, use_exec, carbon_aware_flag\n        \n        job_priorities = []\n        for job_dag in job_dags:\n            if self.exec_map[job_dag] >= self.exec_cap:\n                continue\n            priority = 0.0\n            for node in frontier_nodes:\n                if node.job_dag == job_dag:\n                    duration = self._estimate_task_duration(node)\n                    if duration < self.short_task_threshold:\n                        priority = 100.0\n                    elif normalized_carbon < self.low_carbon_threshold_ratio:\n                        priority = 60.0 + (node.num_tasks - node.next_task_idx) / max(1, node.num_tasks) * 20.0\n                    else:\n                        time_factor = 1.0 - normalized_carbon\n                        priority = time_factor * 40.0 + (1 - normalized_carbon) * 20.0\n                        if duration < self.short_task_threshold:\n                            priority += 30.0\n                    break\n            heapq.heappush(job_priorities, (-priority, self._counter, job_dag))\n            self._counter += 1\n        \n        while job_priorities:\n            _, _, job_dag = heapq.heappop(job_priorities)\n            selected_node = None\n            for node in frontier_nodes:\n                if node.job_dag == job_dag:\n                    selected_node = node\n                    break\n            if selected_node is None:\n                continue\n            \n            remaining = selected_node.num_tasks - selected_node.next_task_idx\n            commit = exec_commit.node_commit.get(selected_node, 0)\n            moving = moving_executors.count(selected_node)\n            available = remaining - commit - moving\n            if available <= 0:\n                continue\n            \n            max_for_job = self.exec_cap - self.exec_map[job_dag]\n            use_exec = min(available, num_source_exec, max_for_job)\n            if use_exec <= 0:\n                continue\n            \n            duration = self._estimate_task_duration(selected_node)\n            if normalized_carbon > self.high_carbon_threshold_ratio and duration >= self.short_task_threshold:\n                use_exec = max(1, int(use_exec * 0.3))\n            \n            self.exec_map[job_dag] += use_exec\n            carbon_aware_flag = (duration >= self.short_task_threshold and normalized_carbon > 0.3)\n            return selected_node, use_exec, carbon_aware_flag\n        \n        return None, num_source_exec, False\n# === END CARBON-AWARE LOGIC ===", "# fifo_agent.py implements pure FIFO scheduling (no carbon awareness).\n# === BEGIN CARBON-AWARE LOGIC ===\nimport numpy as np\nfrom agents.agent import Agent\nimport math\nfrom collections import defaultdict\nfrom typing import List, Tuple, Optional\n\nclass NewAgent(Agent):\n    def __init__(self, exec_cap, carbon_schedule, exec_lower_bound=20):\n        Agent.__init__(self)\n        self.exec_map = {}\n        self.carbon_schedule = carbon_schedule\n        self.exec_cap_MAX = exec_cap\n        self.exec_cap = exec_cap\n        self.B = exec_lower_bound\n        \n        # Carbon forecasting and history\n        self.carbon_history = []\n        self.forecast_window = 120  # 2 hours in minutes\n        self.clean_threshold_percentile = 25\n        self.dirty_threshold_percentile = 75\n        \n        # Job tracking\n        self.job_critical_paths = {}  # job_dag -> set of critical frontier nodes\n        self.job_slack_times = {}     # job_dag -> dict: node -> slack time\n        self.job_carbon_debt = {}     # job_dag -> accumulated debt (decaying)\n        self.job_last_allocation_time = {}  # job_dag -> timestamp\n        self.job_total_tasks_remaining = {} # job_dag -> count\n        \n        # Starvation thresholds (adaptive per job type)\n        self.critical_starvation_ms = 120000    # 2 minutes\n        self.standard_starvation_ms = 300000    # 5 minutes\n        self.deferrable_starvation_ms = 900000  # 15 minutes\n        \n        # Allocation parameters\n        self.min_executors = 1\n        self.debt_decay_factor = 0.9  # per hour decay\n        \n    def get_carbon_intensity(self, current_time):\n        current_carbon = self.carbon_schedule.get(current_time, 300)\n        \n        # Update carbon history\n        self.carbon_history.append((current_time, current_carbon))\n        cutoff = current_time - 1440 * 60000\n        self.carbon_history = [(t, c) for t, c in self.carbon_history if t >= cutoff]\n        if len(self.carbon_history) > 1440:\n            self.carbon_history = self.carbon_history[-1440:]\n        \n        # Compute rolling statistics\n        if len(self.carbon_history) >= 60:\n            recent = [c for _, c in self.carbon_history[-60:]]\n            rolling_avg = np.mean(recent)\n            std = np.std(recent)\n            L = max(0, rolling_avg - 2 * std)\n            U = rolling_avg + 2 * std\n            if L >= U:\n                L = U - 10\n        else:\n            L = cu
